<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Function selector derivation and calldata dispatch</title>
<desc id="desc">A canonical signature is hashed with Keccak-256 and truncated to its first four bytes. That selector is prepended to ABI-encoded arguments, and target contract bytecode compares it against its dispatch table. A selector is only four bytes, so collisions are possible.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D19"/><stop offset="1" stop-color="#14213B"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8CA8D6"/></marker>
</defs>
<rect width="1200" height="660" rx="22" fill="url(#bg)"/>
<text x="44" y="42" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#74C0FC">ABI · FUNCTION SELECTORS</text>
<text x="44" y="82" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#F8FAFC">Signature → hash → selector → dispatch</text>
<g font-family="Arial,sans-serif">
  <rect x="44" y="122" width="310" height="100" rx="14" fill="#18263C" stroke="#6EA8FE" stroke-width="1.5"/>
  <text x="66" y="153" font-size="15" font-weight="700" fill="#F8FAFC">1 · Canonical signature</text>
  <text x="66" y="181" font-size="14" fill="#93C5FD">transfer(address,uint256)</text>
  <text x="66" y="203" font-size="11" fill="#C4D2E7">Name + canonical parameter types</text>
  <path d="M354 172 H420" stroke="#8CA8D6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="122" width="310" height="100" rx="14" fill="#1D2C40" stroke="#B197FC" stroke-width="1.5"/>
  <text x="452" y="153" font-size="15" font-weight="700" fill="#F8FAFC">2 · Keccak-256</text>
  <text x="452" y="181" font-size="13" fill="#D4C5FF">Hash the signature bytes</text>
  <text x="452" y="203" font-size="11" fill="#C4D2E7">Use Keccak-256, not NIST SHA3-256</text>
  <path d="M740 172 H806" stroke="#8CA8D6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="816" y="122" width="340" height="100" rx="14" fill="#182F36" stroke="#34D399" stroke-width="1.5"/>
  <text x="838" y="153" font-size="15" font-weight="700" fill="#F8FAFC">3 · First four bytes</text>
  <text x="838" y="183" font-size="22" font-weight="700" fill="#A7F3D0">0xa9059cbb</text>
  <text x="838" y="204" font-size="11" fill="#C4D2E7">Selector for transfer(address,uint256)</text>
  <path d="M986 222 V265" stroke="#8CA8D6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="274" width="726" height="98" rx="14" fill="#202B40" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="452" y="305" font-size="15" font-weight="700" fill="#F8FAFC">4 · Standard calldata</text>
  <rect x="452" y="319" width="180" height="34" rx="7" fill="#4A3515" stroke="#FBBF24"/>
  <text x="542" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#FDE68A">4-byte selector</text>
  <rect x="644" y="319" width="490" height="34" rx="7" fill="#18263C" stroke="#6EA8FE"/>
  <text x="889" y="341" text-anchor="middle" font-size="13" fill="#C4D2E7">ABI-encoded arguments (recipient + amount)</text>
  <path d="M430 323 H354 V422 H420" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="430" y="410" width="726" height="104" rx="14" fill="#18263C" stroke="#6EA8FE" stroke-width="1.5"/>
  <text x="452" y="442" font-size="15" font-weight="700" fill="#F8FAFC">5 · Contract dispatch code</text>
  <text x="452" y="468" font-size="13" fill="#C4D2E7">Loads selector → compares with supported selectors → decodes arguments</text>
  <text x="452" y="491" font-size="11" fill="#91A8C7">Dispatch behavior is implemented in bytecode; the EVM does not read the JSON ABI.</text>
  <rect x="44" y="410" width="310" height="104" rx="14" fill="#18263C" stroke="#F87171" stroke-width="1.5"/>
  <text x="66" y="442" font-size="15" font-weight="700" fill="#FCA5A5">Important limitation</text>
  <text x="66" y="466" font-size="13" fill="#C4D2E7">Only 4 bytes (32 bits)</text>
  <text x="66" y="489" font-size="12" fill="#C4D2E7">Collisions are possible; not identity or auth</text>
  <rect x="44" y="548" width="1112" height="64" rx="12" fill="#101B2D" stroke="#405775"/>
  <text x="68" y="574" font-size="13" font-weight="700" fill="#F8FAFC">Remember the boundaries</text>
  <text x="68" y="597" font-size="12" fill="#C4D2E7">Function selector: 4 bytes · Custom error selector: 4 bytes · Event signature topic: full 32-byte hash for a non-anonymous event</text>
  <text x="44" y="640" font-size="11" fill="#91A8C7">A selector hints at intended dispatch; it does not prove that the target implements the signature or that the caller is authorized.</text>
</g>
</svg>
