<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic Contract Deployment</title>
  <desc id="desc">A flow diagram showing deployment inputs feeding a predictable address calculation, followed by factory deployment and verification. A second panel shows that cross-chain address matching requires the same deployer address, salt, and initialization code hash.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.h{font:700 25px Arial,sans-serif;fill:#0f172a}.sub{font:16px Arial,sans-serif;fill:#475569}.label{font:700 17px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.mono{font:14px ui-monospace,Menlo,monospace;fill:#0f172a}.blue{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.teal{fill:#ccfbf1;stroke:#2dd4bf;stroke-width:2}.amber{fill:#fef3c7;stroke:#fbbf24;stroke-width:2}.purple{fill:#ede9fe;stroke:#a78bfa;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="680" rx="20"/>
  <text x="48" y="52" class="h">Deterministic Contract Deployment</text>
  <text x="48" y="80" class="sub">Predict the destination before deploying — then verify the actual result.</text>
  <rect x="35" y="108" width="1130" height="320" rx="18" class="panel"/>
  <text x="60" y="143" class="label">1 · Prediction and deployment flow</text>
  <rect x="62" y="173" width="300" height="206" rx="14" class="blue"/>
  <text x="84" y="205" class="label">Known deployment inputs</text>
  <text x="84" y="239" class="body">CREATE2:</text>
  <text x="101" y="266" class="body">• Executing deployer address</text>
  <text x="101" y="291" class="body">• 32-byte salt</text>
  <text x="101" y="316" class="body">• Init code (incl. constructor args)</text>
  <text x="84" y="353" class="small">Inputs must match exactly.</text>
  <path d="M363 276 H414" class="line"/>
  <rect x="420" y="205" width="300" height="142" rx="14" class="purple"/>
  <text x="447" y="237" class="label">Compute expected address</text>
  <text x="447" y="269" class="body">Hash the deployment inputs</text>
  <text x="447" y="293" class="body">before sending the transaction.</text>
  <text x="447" y="321" class="small">Prediction ≠ deployment success</text>
  <path d="M721 276 H772" class="line"/>
  <rect x="778" y="173" width="337" height="91" rx="14" class="amber"/>
  <text x="803" y="205" class="label">Factory executes CREATE2</text>
  <text x="803" y="231" class="body">Init code runs at the target address.</text>
  <path d="M946 265 V292" class="line"/>
  <rect x="778" y="300" width="337" height="79" rx="14" class="teal"/>
  <text x="803" y="329" class="label">Verify deployment</text>
  <text x="803" y="353" class="body">Receipt, code, state, ownership</text>
  <rect x="35" y="450" width="1130" height="194" rx="18" class="panel"/>
  <text x="60" y="485" class="label">2 · Cross-chain address matching</text>
  <rect x="63" y="507" width="295" height="104" rx="14" class="blue"/>
  <text x="88" y="537" class="label">Network A</text>
  <text x="88" y="562" class="body">Same factory + salt + init-code hash</text>
  <text x="88" y="588" class="small">Predicted address: 0x…ABC</text>
  <rect x="842" y="507" width="295" height="104" rx="14" class="blue"/>
  <text x="867" y="537" class="label">Network B</text>
  <text x="867" y="562" class="body">Same factory + salt + init-code hash</text>
  <text x="867" y="588" class="small">Predicted address: 0x…ABC</text>
  <path d="M359 559 H480" class="line"/>
  <path d="M840 559 H720" class="line"/>
  <rect x="487" y="518" width="226" height="82" rx="13" class="amber"/>
  <text x="600" y="546" text-anchor="middle" class="label">Same address</text>
  <text x="600" y="571" text-anchor="middle" class="small">Not necessarily same behavior</text>
  <text x="600" y="626" text-anchor="middle" class="small">Chain-specific state and external dependencies must still be checked.</text>
</svg>