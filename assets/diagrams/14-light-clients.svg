<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Light Client Verification</title><desc id="desc">Low-resource clients verify selected data against authenticated consensus and state commitments.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53627a"/></marker></defs><rect width="1200" height="500" fill="#f7f9fc"/><text x="60" y="60" font-family="Inter, sans-serif" font-size="28" font-weight="750" fill="#172033">Light Client Verification</text><text x="60" y="91" font-family="Inter, sans-serif" font-size="15" fill="#526078">Low-resource clients verify selected data against authenticated consensus and state commitments.</text><rect x="60" y="180" width="245" height="178" rx="18" fill="#eaf2ff" stroke="#7aa5ec" stroke-width="2"/><text x="82" y="217" font-size="18" font-weight="700" fill="#172033">Bootstrap</text><text x="82" y="253" font-size="14" fill="#172033">trusted checkpoint</text><text x="82" y="280" font-size="14" fill="#172033">initial committee</text><text x="82" y="307" font-size="14" fill="#172033">network identity</text><path d="M305 268 H338" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="345" y="180" width="245" height="178" rx="18" fill="#fff3dc" stroke="#e0ac49" stroke-width="2"/><text x="367" y="217" font-size="18" font-weight="700" fill="#172033">Verify headers</text><text x="367" y="253" font-size="14" fill="#172033">sync committee</text><text x="367" y="280" font-size="14" fill="#172033">signature updates</text><text x="367" y="307" font-size="14" fill="#172033">freshness</text><path d="M590 268 H623" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="630" y="180" width="245" height="178" rx="18" fill="#e3f7ee" stroke="#5bbd92" stroke-width="2"/><text x="652" y="217" font-size="18" font-weight="700" fill="#172033">Request data</text><text x="652" y="253" font-size="14" fill="#172033">state / account</text><text x="652" y="280" font-size="14" fill="#172033">proof material</text><text x="652" y="307" font-size="14" fill="#172033">provider response</text><path d="M875 268 H908" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="915" y="180" width="245" height="178" rx="18" fill="#f1eafe" stroke="#a88be8" stroke-width="2"/><text x="937" y="217" font-size="18" font-weight="700" fill="#172033">Verify result</text><text x="937" y="253" font-size="14" fill="#172033">proof vs. root</text><text x="937" y="280" font-size="14" fill="#172033">apply trust model</text><text x="937" y="307" font-size="14" fill="#172033">use cautiously</text><rect x="60" y="405" width="1080" height="55" rx="13" fill="#fff" stroke="#d7dee9"/><text x="82" y="438" font-family="Inter, sans-serif" font-size="15" fill="#526078">A normal hosted RPC response is not automatically proof-verified by a light client.</text></svg>