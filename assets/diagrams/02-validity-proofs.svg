<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Validity Proofs — Prove the Transition</title><desc id="desc">A prover demonstrates that a transition satisfies the rollup's specified execution rules.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53627a"/></marker></defs><rect width="1200" height="500" fill="#f7f9fc"/><text x="60" y="58" font-family="Inter, sans-serif" font-size="27" font-weight="750" fill="#172033">Validity Proofs — Prove the Transition</text><text x="60" y="91" font-family="Inter, sans-serif" font-size="15" fill="#526078">A prover demonstrates that a transition satisfies the rollup's specified execution rules.</text><rect x="60" y="165" width="330" height="206" rx="18" fill="#eaf2ff" stroke="#7aa5ec" stroke-width="2"/><text x="82" y="204" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#172033">L2 execution</text><text x="82" y="229" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#526078">STEP 01</text><text x="82" y="270" font-family="Inter, sans-serif" font-size="14" fill="#172033">Transactions → new state</text><text x="82" y="333" font-family="Inter, sans-serif" font-size="12" font-weight="650" fill="#526078">INPUT / PRECONDITION</text><path d="M390 267 H423" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="435" y="165" width="330" height="206" rx="18" fill="#fff3dc" stroke="#e0ac49" stroke-width="2"/><text x="457" y="204" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#172033">Proof generation</text><text x="457" y="229" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#526078">STEP 02</text><text x="457" y="270" font-family="Inter, sans-serif" font-size="14" fill="#172033">Prover creates proof</text><text x="457" y="333" font-family="Inter, sans-serif" font-size="12" font-weight="650" fill="#526078">PROTOCOL PROCESS</text><path d="M765 267 H798" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="165" width="330" height="206" rx="18" fill="#e3f7ee" stroke="#5bbd92" stroke-width="2"/><text x="832" y="204" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#172033">L1 verification</text><text x="832" y="229" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#526078">STEP 03</text><text x="832" y="270" font-family="Inter, sans-serif" font-size="14" fill="#172033">Contract checks inputs</text><text x="832" y="333" font-family="Inter, sans-serif" font-size="12" font-weight="650" fill="#526078">OUTPUT / TRUST BOUNDARY</text><rect x="60" y="411" width="1080" height="53" rx="13" fill="#fff" stroke="#d7dee9"/><text x="82" y="443" font-family="Inter, sans-serif" font-size="15" fill="#526078">Proof soundness depends on the circuit/VM relation and correct public-input binding.</text></svg>