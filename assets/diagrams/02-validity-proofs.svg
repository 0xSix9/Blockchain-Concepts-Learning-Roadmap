<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Validity Proofs: Prove and Verify an L2 State Transition</title>
<desc id="desc">Transactions execute offchain, the prover produces a proof bound to old and new state roots and batch data, Ethereum's verifier checks it, and the rollup contract accepts the new state only if proof verification and protocol checks pass. A bottom note separates validity from data availability and zero knowledge privacy.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#101b33"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
</defs>
<rect width="1200" height="660" rx="22" fill="#f7f9fc"/>
<rect x="0" y="0" width="1200" height="142" rx="22" fill="url(#header)"/>
<rect x="0" y="120" width="1200" height="22" fill="#1e3a8a"/>
<text x="44" y="43" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.3" fill="#93c5fd">STAGE 07 · ADVANCED LAYER 2 AND CROSS-CHAIN</text>
<text x="44" y="85" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="750" fill="#ffffff">Validity Proofs</text>
<text x="44" y="114" font-family="Inter,Arial,sans-serif" font-size="15" fill="#dbeafe">Prove a state transition offchain; verify its correctness efficiently on Ethereum.</text>

<text x="44" y="184" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750" fill="#172033">Proof generation and verification flow</text>
<text x="44" y="208" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Conceptual model — exact batch fields and contract interfaces vary by rollup.</text>

<rect x="42" y="242" width="248" height="170" rx="16" fill="#eaf2ff" stroke="#7aa5ec" stroke-width="2"/>
<text x="62" y="276" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="1.1" fill="#2857a4">01 · EXECUTE</text>
<text x="62" y="307" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">L2 execution</text>
<text x="62" y="338" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">Apply ordered transactions</text>
<text x="62" y="360" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">to the prior state root R₀.</text>
<rect x="62" y="377" width="200" height="22" rx="6" fill="#dbeafe"/>
<text x="72" y="392" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#2857a4">OUTPUT: proposed root R₁</text>

<path d="M290 326 H314" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="324" y="242" width="248" height="170" rx="16" fill="#fff3dc" stroke="#e0ac49" stroke-width="2"/>
<text x="344" y="276" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="1.1" fill="#995c00">02 · PROVE</text>
<text x="344" y="307" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Prover</text>
<text x="344" y="338" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">Runs the circuit / VM relation</text>
<text x="344" y="360" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">using witness data.</text>
<rect x="344" y="377" width="200" height="22" rx="6" fill="#fef3c7"/>
<text x="354" y="392" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#995c00">OUTPUT: proof π</text>

<path d="M572 326 H596" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="606" y="242" width="248" height="170" rx="16" fill="#f1eafe" stroke="#a88be8" stroke-width="2"/>
<text x="626" y="276" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="1.1" fill="#6741a5">03 · VERIFY</text>
<text x="626" y="307" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">L1 verifier</text>
<text x="626" y="338" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">Checks π against the public</text>
<text x="626" y="360" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">inputs and verification rules.</text>
<rect x="626" y="377" width="200" height="22" rx="6" fill="#ede9fe"/>
<text x="636" y="392" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#6741a5">RESULT: accept / reject</text>

<path d="M854 326 H878" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="888" y="242" width="270" height="170" rx="16" fill="#e3f7ee" stroke="#5bbd92" stroke-width="2"/>
<text x="908" y="276" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="1.1" fill="#16744a">04 · SETTLE</text>
<text x="908" y="307" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172033">Rollup contract</text>
<text x="908" y="338" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">Updates / accepts R₁ only if</text>
<text x="908" y="360" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">proof and protocol checks pass.</text>
<rect x="908" y="377" width="230" height="22" rx="6" fill="#d1fae5"/>
<text x="918" y="392" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#16744a">NEXT: L1 consensus finality</text>

<text x="44" y="456" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" fill="#172033">What must be bound to the proof?</text>
<rect x="42" y="477" width="352" height="72" rx="12" fill="#ffffff" stroke="#d7dee9" stroke-width="1.5"/>
<text x="60" y="505" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Public inputs</text>
<text x="60" y="529" font-family="Inter,Arial,sans-serif" font-size="13" fill="#526078">R₀ · R₁ · batch/data commitment · context</text>
<rect x="424" y="477" width="352" height="72" rx="12" fill="#ffffff" stroke="#d7dee9" stroke-width="1.5"/>
<text x="442" y="505" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Witness and execution rules</text>
<text x="442" y="529" font-family="Inter,Arial,sans-serif" font-size="13" fill="#526078">Transactions · intermediate state · constraints</text>
<rect x="806" y="477" width="352" height="72" rx="12" fill="#ffffff" stroke="#d7dee9" stroke-width="1.5"/>
<text x="824" y="505" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Verifier / circuit integrity</text>
<text x="824" y="529" font-family="Inter,Arial,sans-serif" font-size="13" fill="#526078">Sound relation · correct inputs · safe upgrades</text>

<rect x="42" y="574" width="1116" height="54" rx="12" fill="#172033"/>
<text x="62" y="597" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="750" fill="#93c5fd">THREE DISTINCT GUARANTEES</text>
<text x="62" y="616" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ffffff">Validity ≠ data availability ≠ privacy. L1 proof acceptance is also distinct from L1 consensus finality.</text>
</svg>