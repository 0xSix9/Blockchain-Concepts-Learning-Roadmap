<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Full Node Responsibilities</title><desc id="desc">A synced Ethereum node validates execution and follows consensus via two clients.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53627a"/></marker></defs><rect width="1200" height="500" fill="#f7f9fc"/><text x="60" y="60" font-family="Inter, sans-serif" font-size="28" font-weight="750" fill="#172033">Full Node Responsibilities</text><text x="60" y="91" font-family="Inter, sans-serif" font-size="15" fill="#526078">A synced Ethereum node validates execution and follows consensus via two clients.</text><rect x="60" y="180" width="245" height="178" rx="18" fill="#eaf2ff" stroke="#7aa5ec" stroke-width="2"/><text x="82" y="217" font-size="18" font-weight="700" fill="#172033">Peer network</text><text x="82" y="253" font-size="14" fill="#172033">blocks + txs</text><text x="82" y="280" font-size="14" fill="#172033">sync strategy</text><text x="82" y="307" font-size="14" fill="#172033">data intake</text><path d="M305 268 H338" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="345" y="180" width="245" height="178" rx="18" fill="#fff3dc" stroke="#e0ac49" stroke-width="2"/><text x="367" y="217" font-size="18" font-weight="700" fill="#172033">Execution client</text><text x="367" y="253" font-size="14" fill="#172033">validate / execute</text><text x="367" y="280" font-size="14" fill="#172033">state + receipts</text><text x="367" y="307" font-size="14" fill="#172033">execution RPC</text><path d="M590 268 H623" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="630" y="180" width="245" height="178" rx="18" fill="#e3f7ee" stroke="#5bbd92" stroke-width="2"/><text x="652" y="217" font-size="18" font-weight="700" fill="#172033">Consensus client</text><text x="652" y="253" font-size="14" fill="#172033">beacon state</text><text x="652" y="280" font-size="14" fill="#172033">fork choice</text><text x="652" y="307" font-size="14" fill="#172033">finality</text><path d="M875 268 H908" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="915" y="180" width="245" height="178" rx="18" fill="#f1eafe" stroke="#a88be8" stroke-width="2"/><text x="937" y="217" font-size="18" font-weight="700" fill="#172033">Application</text><text x="937" y="253" font-size="14" fill="#172033">local RPC</text><text x="937" y="280" font-size="14" fill="#172033">monitor sync</text><text x="937" y="307" font-size="14" fill="#172033">apply policy</text><rect x="60" y="405" width="1080" height="55" rx="13" fill="#fff" stroke="#d7dee9"/><text x="82" y="438" font-family="Inter, sans-serif" font-size="15" fill="#526078">A full node is not automatically a validator or an archive of every historical state.</text></svg>