<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Receive function call routing in Solidity</title>
<desc id="desc">A call arrives with calldata and optional Ether. If calldata is empty, a declared receive function is called. If receive is absent, a payable fallback can handle it; otherwise the call reverts. If calldata is non-empty, normal selector dispatch applies: a named function or fallback is selected, not receive. A note explains the restrictive 2300 gas stipend used by legacy send and transfer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D19"/><stop offset="1" stop-color="#14213B"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8CA8D6"/></marker>
</defs>
<rect width="1200" height="700" rx="22" fill="url(#bg)"/>
<text x="44" y="42" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#74C0FC">SOLIDITY · RECEIVE FUNCTIONS</text>
<text x="44" y="82" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#F8FAFC">Empty calldata is the key condition</text>
<g font-family="Arial,sans-serif">
  <rect x="390" y="111" width="420" height="66" rx="12" fill="#18263C" stroke="#6EA8FE" stroke-width="1.5"/>
  <text x="600" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC">Incoming message call</text>
  <text x="600" y="160" text-anchor="middle" font-size="12" fill="#C4D2E7">Optional ETH value + calldata bytes</text>
  <path d="M600 177 V200" stroke="#8CA8D6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 202 L750 254 L600 306 L450 254 Z" fill="#202B40" stroke="#B197FC" stroke-width="1.5"/>
  <text x="600" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#F8FAFC">Is calldata empty?</text>
  <text x="600" y="269" text-anchor="middle" font-size="11" fill="#D4C5FF">No function selector present</text>
  <path d="M450 254 H245 V326" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="345" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#A7F3D0">YES</text>
  <path d="M750 254 H955 V326" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="855" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#FDE68A">NO</text>
  <path d="M245 328 L360 369 L245 410 L130 369 Z" fill="#202B40" stroke="#34D399" stroke-width="1.5"/>
  <text x="245" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#F8FAFC">receive()</text>
  <text x="245" y="382" text-anchor="middle" font-size="11" fill="#A7F3D0">declared?</text>
  <path d="M130 369 H85 V430" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M360 369 H405 V430" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="30" y="438" width="250" height="70" rx="12" fill="#302523" stroke="#F87171" stroke-width="1.5"/>
  <text x="155" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#FCA5A5">fallback / revert</text>
  <text x="155" y="488" text-anchor="middle" font-size="11" fill="#C4D2E7">Fallback must be payable for ETH</text>
  <rect x="294" y="438" width="260" height="70" rx="12" fill="#182F36" stroke="#34D399" stroke-width="1.5"/>
  <text x="424" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#A7F3D0">receive() selected</text>
  <text x="424" y="488" text-anchor="middle" font-size="11" fill="#C4D2E7">External + payable, no args</text>
  <path d="M955 328 L1070 369 L955 410 L840 369 Z" fill="#202B40" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="955" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#F8FAFC">Normal dispatch</text>
  <text x="955" y="382" text-anchor="middle" font-size="11" fill="#FDE68A">selector lookup</text>
  <path d="M840 369 H755 V430" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1070 369 H1120 V430" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="620" y="438" width="260" height="70" rx="12" fill="#18263C" stroke="#6EA8FE" stroke-width="1.5"/>
  <text x="750" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#93C5FD">Named function</text>
  <text x="750" y="488" text-anchor="middle" font-size="11" fill="#C4D2E7">If selector matches</text>
  <rect x="906" y="438" width="270" height="70" rx="12" fill="#302523" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="1041" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#FDE68A">fallback()</text>
  <text x="1041" y="488" text-anchor="middle" font-size="11" fill="#C4D2E7">Unknown selector, if present</text>
  <rect x="44" y="544" width="1112" height="92" rx="14" fill="#101B2D" stroke="#405775"/>
  <text x="68" y="575" font-size="15" font-weight="700" fill="#F8FAFC">Gas and safety note</text>
  <text x="68" y="599" font-size="12" fill="#C4D2E7">Legacy send()/transfer() give the receiver a 2,300-gas stipend, which is too little for storage writes.</text>
  <text x="68" y="621" font-size="12" fill="#C4D2E7">Other calls may forward more gas; do not treat the stipend as a universal reentrancy defense.</text>
  <text x="44" y="667" font-size="11" fill="#91A8C7">Forced ETH transfers may change a contract's balance without executing receive() or fallback().</text>
</g>
</svg>
