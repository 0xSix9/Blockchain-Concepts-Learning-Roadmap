<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">RLP: Structure + Length Prefix</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">The same rules apply recursively to byte strings and nested lists</text>
  <rect x="70" y="125" width="470" height="185" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="305" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Byte string: "dog"</text>
  <rect x="120" y="190" width="90" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="215" text-anchor="middle" font-family="monospace" font-size="16" fill="#1e3a8a">0x83</text>
  <text x="165" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a">prefix</text>
  <rect x="220" y="190" width="75" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="257" y="226" text-anchor="middle" font-family="monospace" font-size="17" fill="#14532d">d</text>
  <rect x="305" y="190" width="75" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="342" y="226" text-anchor="middle" font-family="monospace" font-size="17" fill="#14532d">o</text>
  <rect x="390" y="190" width="75" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="427" y="226" text-anchor="middle" font-family="monospace" font-size="17" fill="#14532d">g</text>
  <text x="305" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">0x83 = 0x80 + 3 payload bytes</text>
  <rect x="660" y="125" width="470" height="185" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="895" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">List: ["cat", "dog"]</text>
  <rect x="710" y="190" width="90" height="60" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="755" y="215" text-anchor="middle" font-family="monospace" font-size="16" fill="#9a3412">0xc8</text>
  <text x="755" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">list prefix</text>
  <rect x="810" y="190" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="875" y="215" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e3a8a">83 63 61 74</text>
  <text x="875" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a">encoded "cat"</text>
  <rect x="950" y="190" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1015" y="215" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e3a8a">83 64 6f 67</text>
  <text x="1015" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e3a8a">encoded "dog"</text>
  <text x="895" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">0xc8 = 0xc0 + 8 encoded payload bytes</text>
  <path d="M600 335 L600 380" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M590 370 L600 382 L610 370" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="400" width="900" height="165" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">How decoding works</text>
  <rect x="195" y="465" width="200" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="295" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Read first byte</text>
  <text x="295" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Identify prefix range</text>
  <path d="M400 496 L455 496" stroke="#64748b" stroke-width="2.5"/>
  <path d="M447 488 L457 496 L447 504" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <rect x="465" y="465" width="270" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Determine payload length</text>
  <text x="600" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Short form or length-of-length</text>
  <path d="M740 496 L795 496" stroke="#64748b" stroke-width="2.5"/>
  <path d="M787 488 L797 496 L787 504" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <rect x="805" y="465" width="200" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="905" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Decode recursively</text>
  <text x="905" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Rebuild nested lists</text>
  <text x="600" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">RLP encodes structure; higher-level protocol rules define value meaning.</text>
</svg>