<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Solidity Interfaces and Libraries</title>
  <desc id="desc">An interface declares the expected functions at a contract boundary and calls a separate contract normally. A library provides reusable code: internal functions are compiled into the caller, while public or external library functions use a linked deployed library and delegate-call context.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.teal{fill:#ecfeff;stroke:#22d3ee;stroke-width:2}
      .gold{fill:#fffbeb;stroke:#f59e0b;stroke-width:2}.purple{fill:#f5f3ff;stroke:#a78bfa;stroke-width:2}
      .ink{fill:#0f172a;font-family:Inter,Arial,sans-serif}.muted{fill:#475569;font-family:Inter,Arial,sans-serif}
      .title{font-size:29px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600}
      .line{stroke:#64748b;stroke-width:2.5;fill:none}.arrow{stroke:#2563eb;stroke-width:3;fill:none}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="1200" height="800" rx="24"/>
  <text class="ink title" x="42" y="52">Interfaces and Libraries: Two Different Jobs</text>
  <text class="muted body" x="44" y="82">An interface describes the boundary; a library supplies reusable implementation code.</text>

  <rect class="panel" x="36" y="110" width="1128" height="290" rx="18"/>
  <text class="ink head" x="60" y="146">1. Interface → separate deployed contract</text>
  <rect class="purple" x="62" y="174" width="205" height="86" rx="12"/>
  <text class="ink head" x="164" y="205" text-anchor="middle">Caller</text>
  <text class="muted body" x="164" y="230" text-anchor="middle">uses IPriceFeed</text>
  <rect class="blue" x="352" y="174" width="245" height="86" rx="12"/>
  <text class="ink head" x="474" y="205" text-anchor="middle">Interface</text>
  <text class="ink mono" x="474" y="231" text-anchor="middle">latestPrice()</text>
  <rect class="teal" x="684" y="174" width="440" height="86" rx="12"/>
  <text class="ink head" x="904" y="205" text-anchor="middle">Deployed implementation</text>
  <text class="muted body" x="904" y="231" text-anchor="middle">Own code, own storage context</text>
  <path class="arrow" d="M267 216 L344 216" marker-end="url(#arrow)"/>
  <path class="arrow" d="M597 216 L676 216" marker-end="url(#arrow)"/>
  <text class="muted small" x="305" y="199" text-anchor="middle">declares</text>
  <text class="muted small" x="636" y="199" text-anchor="middle">normal call</text>
  <text class="muted body" x="62" y="300">Interface = function signatures and data shapes, not implementation.</text>
  <text class="muted body" x="62" y="329">A matching ABI does not prove the target is honest, safe, or semantically correct.</text>
  <text class="muted small" x="62" y="361">The caller encodes calldata and decodes return data using the interface's declared ABI.</text>

  <rect class="panel" x="36" y="422" width="1128" height="338" rx="18"/>
  <text class="ink head" x="60" y="459">2. Library → reusable logic</text>
  <rect class="gold" x="62" y="488" width="300" height="104" rx="12"/>
  <text class="ink head" x="212" y="519" text-anchor="middle">Internal function</text>
  <text class="mono" x="212" y="546" text-anchor="middle">FeeMath.feeFor()</text>
  <text class="muted small" x="212" y="570" text-anchor="middle">using for or direct call</text>
  <rect class="teal" x="450" y="488" width="290" height="104" rx="12"/>
  <text class="ink head" x="595" y="519" text-anchor="middle">Caller bytecode</text>
  <text class="muted body" x="595" y="546" text-anchor="middle">Library code included</text>
  <text class="muted small" x="595" y="570" text-anchor="middle">No deployed library call</text>
  <path class="arrow" d="M362 541 L442 541" marker-end="url(#arrow)"/>

  <rect class="blue" x="62" y="615" width="300" height="104" rx="12"/>
  <text class="ink head" x="212" y="646" text-anchor="middle">Public / external</text>
  <text class="mono" x="212" y="672" text-anchor="middle">Library.method()</text>
  <text class="muted small" x="212" y="696" text-anchor="middle">Link deployed library</text>
  <rect class="purple" x="450" y="615" width="290" height="104" rx="12"/>
  <text class="ink head" x="595" y="646" text-anchor="middle">Deployed library</text>
  <text class="muted body" x="595" y="672" text-anchor="middle">Shared code address</text>
  <text class="muted small" x="595" y="696" text-anchor="middle">Delegate-call semantics</text>
  <path class="arrow" d="M362 667 L442 667" marker-end="url(#arrow)"/>

  <rect class="panel" x="790" y="488" width="334" height="231" rx="12"/>
  <text class="ink head" x="812" y="520">Remember</text>
  <text class="ink body" x="812" y="551">Interface: describes how to call.</text>
  <text class="ink body" x="812" y="581">Library: reuses implementation.</text>
  <text class="muted body" x="812" y="620">Normal call uses callee context.</text>
  <text class="muted body" x="812" y="649">Library external call uses caller</text>
  <text class="muted body" x="812" y="672">context under delegate-call rules.</text>
  <text class="muted small" x="812" y="700">Review storage effects and linking.</text>
</svg>