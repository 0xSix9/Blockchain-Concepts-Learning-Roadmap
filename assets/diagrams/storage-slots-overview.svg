<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Storage Slots: Addressing Persistent Contract State</title>
  <desc id="desc">Contract address selects a storage context, the slot key selects a 32-byte word, SLOAD reads the word, and eth_getStorageAt queries a value at a selected block.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.8; }
      .teal { fill: #ecfeff; stroke: #22d3ee; stroke-width: 1.8; }
      .gold { fill: #fffbeb; stroke: #fbbf24; stroke-width: 1.8; }
      .ink { fill: #0f172a; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #475569; font-family: Inter, Arial, sans-serif; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .mono { font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="720" rx="24"/>
  <text class="ink heading" x="48" y="50">Storage Slots: Addressing Persistent State</text>
  <text class="muted body" x="48" y="78">A slot key selects one 32-byte word inside one contract's storage context.</text>

  <rect class="panel" x="48" y="112" width="260" height="184" rx="16"/>
  <text class="ink label" x="72" y="146">1. Account context</text>
  <rect class="blue" x="72" y="168" width="212" height="56" rx="10"/>
  <text class="ink small" x="90" y="190">Contract address</text>
  <text class="ink mono" x="90" y="211">0x…ContractA</text>
  <text class="muted body" x="72" y="253">Selects whose storage</text>
  <text class="muted body" x="72" y="275">is being queried.</text>

  <path class="line" d="M308 204 L346 204" marker-end="url(#arrow)"/>
  <rect class="panel" x="358" y="112" width="310" height="184" rx="16"/>
  <text class="ink label" x="382" y="146">2. Slot key</text>
  <rect class="teal" x="382" y="168" width="262" height="46" rx="9"/>
  <text class="ink mono" x="398" y="196">slot = 0x0</text>
  <text class="muted body" x="382" y="243">A 256-bit identifier.</text>
  <text class="muted body" x="382" y="265">The key is not the value.</text>

  <path class="line" d="M668 204 L706 204" marker-end="url(#arrow)"/>
  <rect class="panel" x="718" y="112" width="334" height="184" rx="16"/>
  <text class="ink label" x="742" y="146">3. Stored word</text>
  <text class="muted small" x="742" y="171">32 bytes / 256 bits</text>
  <rect x="742" y="185" width="286" height="52" rx="8" fill="#0f172a"/>
  <text x="756" y="216" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">0x0000...0000002a</text>
  <text class="muted body" x="742" y="266">Illustrative value: integer 42</text>

  <rect class="blue" x="48" y="326" width="484" height="144" rx="16"/>
  <text class="ink label" x="72" y="362">EVM: SLOAD</text>
  <text class="muted body" x="72" y="390">Input: slot key</text>
  <path class="line" d="M206 386 L252 386" marker-end="url(#arrow)"/>
  <text class="ink mono" x="272" y="390">32-byte word</text>
  <text class="muted small" x="72" y="431">SSTORE updates a slot during execution,</text>
  <text class="muted small" x="72" y="449">subject to gas rules and transaction rollback.</text>

  <rect class="teal" x="568" y="326" width="484" height="144" rx="16"/>
  <text class="ink label" x="592" y="362">RPC: eth_getStorageAt</text>
  <text class="muted body" x="592" y="390">Inputs: address + slot + block</text>
  <path class="line" d="M592 410 L642 410" marker-end="url(#arrow)"/>
  <text class="ink mono" x="660" y="415">DATA word</text>
  <text class="muted small" x="592" y="449">Returns persistent storage at the selected state.</text>

  <rect class="panel" x="48" y="500" width="1004" height="160" rx="16"/>
  <text class="ink label" x="72" y="536">Keep these distinctions clear</text>
  <rect class="gold" x="72" y="554" width="278" height="76" rx="10"/>
  <text class="ink label" x="90" y="580">Slot key</text>
  <text class="muted body" x="90" y="607">Where to read / write</text>
  <rect class="blue" x="411" y="554" width="278" height="76" rx="10"/>
  <text class="ink label" x="429" y="580">Stored word</text>
  <text class="muted body" x="429" y="607">The raw 32-byte value</text>
  <rect class="teal" x="750" y="554" width="278" height="76" rx="10"/>
  <text class="ink label" x="768" y="580">Decoded field</text>
  <text class="muted body" x="768" y="607">Interpreted using layout + type</text>

  <text class="muted small" x="52" y="690">Conceptual illustration. Slot meaning depends on the contract address, block state, and compiled layout.</text>
</svg>