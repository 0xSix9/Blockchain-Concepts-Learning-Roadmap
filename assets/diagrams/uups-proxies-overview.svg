<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">UUPS Proxy Upgrade Architecture</title>
  <desc id="desc">Users call an ERC-1967 proxy, which delegates to a UUPS implementation. An authorized upgrade request enters through the proxy and runs upgrade logic from the implementation. The implementation validates a new UUPS candidate and updates the implementation slot stored by the proxy.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.teal{fill:#ecfeff;stroke:#22d3ee;stroke-width:2}
      .gold{fill:#fffbeb;stroke:#f59e0b;stroke-width:2}.purple{fill:#f5f3ff;stroke:#a78bfa;stroke-width:2}
      .red{fill:#fef2f2;stroke:#f87171;stroke-width:2}
      .ink{fill:#0f172a;font-family:Inter,Arial,sans-serif}.muted{fill:#475569;font-family:Inter,Arial,sans-serif}
      .title{font-size:30px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}
      .mono{fill:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600}
      .arrow{stroke:#2563eb;stroke-width:3;fill:none}.ok{stroke:#0f766e;stroke-width:2.8;fill:none}.danger{stroke:#dc2626;stroke-width:2.6;fill:none}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0f766e"/></marker>
    <marker id="danger" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect class="bg" width="1200" height="850" rx="24"/>
  <text class="ink title" x="42" y="54">UUPS Proxies — Upgrade Logic in the Implementation</text>
  <text class="muted body" x="44" y="84">The proxy stores the target address; the implementation defines the upgrade path.</text>

  <rect class="panel" x="35" y="112" width="1130" height="390" rx="20"/>
  <rect class="purple" x="70" y="220" width="210" height="100" rx="13"/>
  <text class="ink head" x="175" y="255" text-anchor="middle">User / Owner</text>
  <text class="muted body" x="175" y="283" text-anchor="middle">normal call or upgrade</text>
  <text class="muted small" x="175" y="303" text-anchor="middle">authorized role checked</text>

  <rect class="blue" x="390" y="178" width="300" height="220" rx="16"/>
  <text class="ink head" x="540" y="212" text-anchor="middle">ERC-1967 Proxy</text>
  <rect class="gold" x="420" y="236" width="240" height="64" rx="10"/>
  <text class="ink mono" x="540" y="262" text-anchor="middle">implementation slot</text>
  <text class="muted small" x="540" y="284" text-anchor="middle">points to current logic</text>
  <text class="muted body" x="540" y="330" text-anchor="middle">fallback → DELEGATECALL</text>
  <text class="muted small" x="540" y="355" text-anchor="middle">proxy keeps the application state</text>

  <rect class="teal" x="805" y="160" width="315" height="260" rx="16"/>
  <text class="ink head" x="962" y="195" text-anchor="middle">UUPS Implementation</text>
  <rect class="panel" x="832" y="216" width="261" height="54" rx="10"/>
  <text class="ink mono" x="962" y="249" text-anchor="middle">application logic</text>
  <rect class="gold" x="832" y="286" width="261" height="54" rx="10"/>
  <text class="ink mono" x="962" y="319" text-anchor="middle">upgradeToAndCall</text>
  <text class="muted small" x="962" y="365" text-anchor="middle">authorize via _authorizeUpgrade</text>
  <text class="muted small" x="962" y="389" text-anchor="middle">validate UUPS compatibility</text>

  <path class="arrow" d="M280 270 L382 270" marker-end="url(#arrow)"/>
  <text class="muted small" x="331" y="250" text-anchor="middle">call</text>
  <path class="arrow" d="M690 280 L797 280" marker-end="url(#arrow)"/>
  <text class="ink mono" x="744" y="253" text-anchor="middle">delegatecall</text>

  <rect class="panel" x="65" y="436" width="1055" height="44" rx="9"/>
  <text class="muted body" x="592" y="464" text-anchor="middle">Both business functions and UUPS upgrade logic execute in the proxy context.</text>

  <rect class="panel" x="35" y="528" width="1130" height="280" rx="20"/>
  <text class="ink head" x="65" y="566">Upgrade sequence</text>
  <rect class="purple" x="65" y="596" width="230" height="94" rx="12"/>
  <text class="ink head" x="180" y="628" text-anchor="middle">1. Authorized call</text>
  <text class="muted small" x="180" y="653" text-anchor="middle">through the proxy</text>
  <text class="muted small" x="180" y="673" text-anchor="middle">onlyProxy context</text>

  <rect class="gold" x="350" y="596" width="230" height="94" rx="12"/>
  <text class="ink head" x="465" y="628" text-anchor="middle">2. Access check</text>
  <text class="muted small" x="465" y="653" text-anchor="middle">_authorizeUpgrade</text>
  <text class="muted small" x="465" y="673" text-anchor="middle">owner / governance</text>

  <rect class="teal" x="635" y="596" width="230" height="94" rx="12"/>
  <text class="ink head" x="750" y="628" text-anchor="middle">3. Compatibility</text>
  <text class="muted small" x="750" y="653" text-anchor="middle">proxiableUUID check</text>
  <text class="muted small" x="750" y="673" text-anchor="middle">expected ERC-1967 slot</text>

  <rect class="blue" x="920" y="596" width="210" height="94" rx="12"/>
  <text class="ink head" x="1025" y="628" text-anchor="middle">4. Slot update</text>
  <text class="muted small" x="1025" y="653" text-anchor="middle">new implementation</text>
  <text class="muted small" x="1025" y="673" text-anchor="middle">stored at proxy</text>

  <path class="arrow" d="M295 643 L342 643" marker-end="url(#arrow)"/>
  <path class="arrow" d="M580 643 L627 643" marker-end="url(#arrow)"/>
  <path class="arrow" d="M865 643 L912 643" marker-end="url(#arrow)"/>

  <text class="muted body" x="65" y="735">If authorization, compatibility, or initialization assumptions fail, the upgrade may revert or break future upgradeability.</text>
  <text class="muted small" x="65" y="766">A matching proxiableUUID is a compatibility signal, not a complete security audit.</text>
</svg>