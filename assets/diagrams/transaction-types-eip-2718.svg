<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">EIP-2718 Transaction Types</title>
  <desc id="desc">Diagram comparing legacy RLP transaction bytes to typed envelopes whose leading type byte selects the payload format for types 1 through 4.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 27px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.label{font:700 17px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#334155}.small{font:12px Arial,sans-serif;fill:#475569}.mono{font:700 17px ui-monospace,Menlo,monospace;fill:#0f172a}.blue{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.teal{fill:#ccfbf1;stroke:#2dd4bf;stroke-width:2}.purple{fill:#ede9fe;stroke:#a78bfa;stroke-width:2}.amber{fill:#fef3c7;stroke:#fbbf24;stroke-width:2}.green{fill:#dcfce7;stroke:#4ade80;stroke-width:2}.red{fill:#fee2e2;stroke:#f87171;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760" rx="20"/>
  <text x="42" y="49" class="title">EIP-2718 · Typed Transaction Envelope</text>
  <text x="42" y="78" class="subtitle">One envelope model, multiple payload formats and type-specific rules</text>

  <rect x="32" y="104" width="1136" height="158" rx="18" class="panel"/>
  <text x="58" y="138" class="label">Legacy transaction</text>
  <rect x="62" y="158" width="1074" height="72" rx="12" class="blue"/>
  <text x="599" y="188" text-anchor="middle" class="mono">RLP([nonce, gasPrice, gasLimit, to, value, data, v, r, s])</text>
  <text x="599" y="211" text-anchor="middle" class="small">No EIP-2718 type-byte prefix in the raw legacy encoding</text>

  <rect x="32" y="282" width="1136" height="396" rx="18" class="panel"/>
  <text x="58" y="316" class="label">Typed transaction</text>
  <rect x="62" y="339" width="214" height="86" rx="12" class="purple"/>
  <text x="169" y="369" text-anchor="middle" class="label">Type byte</text>
  <text x="169" y="395" text-anchor="middle" class="mono">0x01 / 0x02 / …</text>
  <path d="M277 382 H317" class="line"/>
  <rect x="323" y="339" width="393" height="86" rx="12" class="teal"/>
  <text x="519" y="370" text-anchor="middle" class="label">Transaction payload</text>
  <text x="519" y="394" text-anchor="middle" class="body">Fields + signature, encoded per type</text>
  <path d="M718 382 H758" class="line"/>
  <rect x="764" y="339" width="370" height="86" rx="12" class="amber"/>
  <text x="949" y="370" text-anchor="middle" class="label">Type-specific decode & validation</text>
  <text x="949" y="394" text-anchor="middle" class="body">Rules defined by the corresponding EIP</text>

  <path d="M949 426 V448 H193 V467" class="line"/>
  <path d="M949 448 H1008 V467" class="line"/>
  <text x="58" y="464" class="label">Major Ethereum types</text>

  <rect x="62" y="483" width="252" height="85" rx="12" class="blue"/>
  <text x="188" y="512" text-anchor="middle" class="label">Type 1 · EIP-2930</text>
  <text x="188" y="537" text-anchor="middle" class="body">Access list</text>
  <text x="188" y="555" text-anchor="middle" class="small">Address + storage keys</text>

  <rect x="332" y="483" width="252" height="85" rx="12" class="green"/>
  <text x="458" y="512" text-anchor="middle" class="label">Type 2 · EIP-1559</text>
  <text x="458" y="537" text-anchor="middle" class="body">Fee-market transaction</text>
  <text x="458" y="555" text-anchor="middle" class="small">Max fee + priority fee</text>

  <rect x="602" y="483" width="252" height="85" rx="12" class="purple"/>
  <text x="728" y="512" text-anchor="middle" class="label">Type 3 · EIP-4844</text>
  <text x="728" y="537" text-anchor="middle" class="body">Blob transaction</text>
  <text x="728" y="555" text-anchor="middle" class="small">Separate blob fee market</text>

  <rect x="872" y="483" width="252" height="85" rx="12" class="amber"/>
  <text x="998" y="512" text-anchor="middle" class="label">Type 4 · EIP-7702</text>
  <text x="998" y="537" text-anchor="middle" class="body">Set-code transaction</text>
  <text x="998" y="555" text-anchor="middle" class="small">Authorization list</text>

  <rect x="62" y="589" width="1062" height="60" rx="12" class="red"/>
  <text x="593" y="614" text-anchor="middle" class="label">Support is not implied by an available type number</text>
  <text x="593" y="635" text-anchor="middle" class="small">Check the specification, network activation, and client support; draft proposals may not be live types.</text>

  <text x="600" y="719" text-anchor="middle" class="small">Typed receipts use the matching type identifier + type-specific receipt payload.</text>
</svg>