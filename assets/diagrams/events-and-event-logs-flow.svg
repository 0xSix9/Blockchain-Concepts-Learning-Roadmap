<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">Events and event logs flow</title>
  <desc id="desc">A Solidity contract declares and emits an event. The EVM creates a log containing the contract address, topics, and ABI-encoded data in the transaction receipt. Off-chain indexers query, decode, and process the logs while accounting for reorgs and reverted execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14243a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .h1{font:700 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f8fafc}
      .sub{font:400 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#b6c4d8}
      .ct{font:700 21px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}
      .body{font:400 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#d7e0ec}
      .mono{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fff}
      .small{font:400 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#bfccdd}
      .line{fill:none;stroke:#7dd3fc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .yes{font:700 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#86efac}
      .warn{font:700 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fcd34d}
    </style>
  </defs>
  <rect width="1200" height="810" rx="26" fill="url(#bg)"/>
  <circle cx="1080" cy="88" r="160" fill="#2563eb" opacity=".08"/>
  <circle cx="80" cy="730" r="175" fill="#14b8a6" opacity=".06"/>
  <text x="60" y="68" class="h1">Events and Event Logs</text>
  <text x="60" y="101" class="sub">Contracts emit logs; off-chain applications query, decode, and index them.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="145" width="230" height="170" rx="18" fill="#17263d" stroke="#334155"/>
    <rect x="60" y="145" width="230" height="7" rx="3" fill="url(#blue)"/>
    <text x="84" y="185" class="ct">Solidity code</text>
    <text x="84" y="216" class="mono">event Deposited(...)</text>
    <text x="84" y="244" class="mono">emit Deposited(...)</text>
    <text x="84" y="277" class="body">Declared schema + use</text>
    <text x="84" y="298" class="small">Executes during the call</text>

    <rect x="345" y="145" width="230" height="170" rx="18" fill="#17263d" stroke="#334155"/>
    <rect x="345" y="145" width="230" height="7" rx="3" fill="url(#teal)"/>
    <text x="369" y="185" class="ct">EVM log</text>
    <text x="369" y="216" class="mono">LOG0 ... LOG4</text>
    <text x="369" y="244" class="body">Address + topics + data</text>
    <text x="369" y="277" class="body">Included in execution result</text>
    <text x="369" y="298" class="small">Revert rolls logs back</text>

    <rect x="630" y="145" width="230" height="170" rx="18" fill="#17263d" stroke="#334155"/>
    <rect x="630" y="145" width="230" height="7" rx="3" fill="url(#purple)"/>
    <text x="654" y="185" class="ct">Receipt / RPC</text>
    <text x="654" y="216" class="mono">eth_getLogs</text>
    <text x="654" y="244" class="body">Block, tx and log context</text>
    <text x="654" y="277" class="body">Address + topic filters</text>
    <text x="654" y="298" class="small">Node or provider query</text>

    <rect x="915" y="145" width="225" height="170" rx="18" fill="#17263d" stroke="#334155"/>
    <rect x="915" y="145" width="225" height="7" rx="3" fill="url(#amber)"/>
    <text x="939" y="185" class="ct">Off-chain app</text>
    <text x="939" y="216" class="body">Decode using the ABI</text>
    <text x="939" y="244" class="body">Update index / UI</text>
    <text x="939" y="277" class="body">Deduplicate & reconcile</text>
    <text x="939" y="298" class="small">Handle chain reorganizations</text>
  </g>
  <path d="M290 230 L338 230" class="line"/>
  <path d="M575 230 L623 230" class="line"/>
  <path d="M860 230 L908 230" class="line"/>

  <text x="60" y="365" class="ct">An event log at a glance</text>
  <rect x="60" y="390" width="1080" height="192" rx="18" fill="#0f1b2d" stroke="#334155"/>
  <rect x="84" y="416" width="1032" height="42" rx="10" fill="#23334a"/>
  <text x="105" y="443" class="mono">address</text>
  <text x="275" y="443" class="mono">topics[0]</text>
  <text x="520" y="443" class="mono">topics[1..n]</text>
  <text x="820" y="443" class="mono">data</text>
  <text x="105" y="483" class="body">Emitter contract</text>
  <text x="275" y="483" class="body">Event signature hash</text>
  <text x="520" y="483" class="body">Indexed arguments</text>
  <text x="820" y="483" class="body">ABI-encoded non-indexed args</text>
  <line x1="84" y1="504" x2="1116" y2="504" stroke="#334155"/>
  <text x="105" y="535" class="small">Standard event: signature topic + up to 3 indexed parameters (4 topics total).</text>
  <text x="105" y="558" class="small">Anonymous event: no automatic signature topic; up to 4 indexed parameters.</text>

  <rect x="60" y="606" width="515" height="126" rx="18" fill="#17263d" stroke="#334155"/>
  <text x="84" y="640" class="ct">What events are good for</text>
  <text x="84" y="670" class="body">Indexing transfers, deposits, trades and role changes</text>
  <text x="84" y="696" class="body">Building frontends, analytics and monitoring systems</text>
  <text x="84" y="718" class="small">Filter by contract address, block range and topics</text>

  <rect x="605" y="606" width="535" height="126" rx="18" fill="#17263d" stroke="#334155"/>
  <text x="629" y="640" class="ct">What events are not</text>
  <text x="629" y="670" class="body">Not readable by contracts as historical on-chain state</text>
  <text x="629" y="696" class="body">Not a substitute for storage or authorization checks</text>
  <text x="629" y="718" class="small">Logs from reverted execution are rolled back</text>

  <rect x="60" y="755" width="1080" height="32" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="83" y="776" class="warn">Always decode with the correct ABI and verify the emitting address and canonical-chain status.</text>
</svg>