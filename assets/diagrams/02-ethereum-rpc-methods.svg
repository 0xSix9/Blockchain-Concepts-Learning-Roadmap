<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Ethereum RPC Method Families</title><desc id="desc">Different methods read state, simulate execution, submit transactions, or query logs.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53627a"/></marker><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.ttl{font-size:28px;font-weight:750;fill:#172033}.sub{font-size:15px;fill:#526078}.foot{font-size:15px;fill:#526078}</style></defs><rect width="1200" height="500" fill="#f7f9fc"/><text x="60" y="60" class="ttl">Ethereum RPC Method Families</text><text x="60" y="91" class="sub">Different methods read state, simulate execution, submit transactions, or query logs.</text><rect x="60" y="180" width="245" height="178" rx="18" fill="#eaf2ff" stroke="#7aa5ec" stroke-width="2"/><text x="82" y="217" font-size="18" font-weight="700" fill="#172033">Network</text><text x="82" y="253" font-size="14" fill="#172033">eth_chainId</text><text x="82" y="280" font-size="14" fill="#172033">eth_blockNumber</text><text x="82" y="307" font-size="14" fill="#172033">Chain context</text><path d="M305 268 H338" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="345" y="180" width="245" height="178" rx="18" fill="#fff3dc" stroke="#e0ac49" stroke-width="2"/><text x="367" y="217" font-size="18" font-weight="700" fill="#172033">State reads</text><text x="367" y="253" font-size="14" fill="#172033">eth_getBalance</text><text x="367" y="280" font-size="14" fill="#172033">eth_getCode</text><text x="367" y="307" font-size="14" fill="#172033">Account and storage</text><path d="M590 268 H623" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="630" y="180" width="245" height="178" rx="18" fill="#e3f7ee" stroke="#5bbd92" stroke-width="2"/><text x="652" y="217" font-size="18" font-weight="700" fill="#172033">Execution</text><text x="652" y="253" font-size="14" fill="#172033">eth_call</text><text x="652" y="280" font-size="14" fill="#172033">eth_estimateGas</text><text x="652" y="307" font-size="14" fill="#172033">Simulate locally</text><path d="M875 268 H908" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="915" y="180" width="245" height="178" rx="18" fill="#f1eafe" stroke="#a88be8" stroke-width="2"/><text x="937" y="217" font-size="18" font-weight="700" fill="#172033">Submission & logs</text><text x="937" y="253" font-size="14" fill="#172033">eth_sendRawTransaction</text><text x="937" y="280" font-size="14" fill="#172033">eth_getLogs</text><text x="937" y="307" font-size="14" fill="#172033">Track and filter</text><rect x="60" y="405" width="1080" height="55" rx="13" fill="#fff" stroke="#d7dee9"/><text x="82" y="438" class="foot">JSON-RPC carries the request; the method specification defines the result and guarantees.</text></svg>