<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Solidity fallback and receive dispatch behavior</title>
<desc id="desc">Incoming call data is first checked for emptiness. Empty calldata enters receive if one exists, otherwise fallback. Non-empty calldata is checked against regular external function selectors; a match goes to that function, and an unmatched selector goes to fallback if available. A non-payable fallback rejects calls that send Ether.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D19"/><stop offset="1" stop-color="#14213B"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8CA8D6"/></marker>
</defs>
<rect width="1200" height="740" rx="22" fill="url(#bg)"/>
<text x="44" y="42" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#74C0FC">SOLIDITY · FALLBACK FUNCTIONS</text>
<text x="44" y="82" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#F8FAFC">Where does an incoming call go?</text>
<g font-family="Arial,sans-serif">
  <rect x="400" y="110" width="400" height="64" rx="12" fill="#18263C" stroke="#6EA8FE" stroke-width="1.5"/>
  <text x="600" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC">Incoming message call</text>
  <text x="600" y="157" text-anchor="middle" font-size="12" fill="#C4D2E7">Calldata + optional Ether value</text>
  <path d="M600 174 V196" stroke="#8CA8D6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 198 L740 246 L600 294 L460 246 Z" fill="#202B40" stroke="#B197FC" stroke-width="1.5"/>
  <text x="600" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#F8FAFC">Is calldata empty?</text>
  <text x="600" y="260" text-anchor="middle" font-size="11" fill="#D4C5FF">No four-byte selector in empty input</text>
  <path d="M460 246 H230 V314" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="342" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#A7F3D0">YES · EMPTY</text>
  <path d="M740 246 H970 V314" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="858" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#FDE68A">NO · HAS DATA</text>
  <path d="M230 316 L350 356 L230 396 L110 356 Z" fill="#202B40" stroke="#34D399" stroke-width="1.5"/>
  <text x="230" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#F8FAFC">receive()</text>
  <text x="230" y="369" text-anchor="middle" font-size="11" fill="#A7F3D0">declared?</text>
  <path d="M110 356 H70 V432" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="85" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="#FCA5A5">NO</text>
  <path d="M350 356 H390 V432" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="371" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="#A7F3D0">YES</text>
  <rect x="24" y="439" width="200" height="72" rx="12" fill="#302523" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="124" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#FDE68A">fallback()</text>
  <text x="124" y="490" text-anchor="middle" font-size="11" fill="#C4D2E7">if present and applicable</text>
  <rect x="258" y="439" width="264" height="72" rx="12" fill="#182F36" stroke="#34D399" stroke-width="1.5"/>
  <text x="390" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#A7F3D0">receive() external payable</text>
  <text x="390" y="490" text-anchor="middle" font-size="11" fill="#C4D2E7">Handles empty-calldata call</text>
  <path d="M970 316 L1080 356 L970 396 L860 356 Z" fill="#202B40" stroke="#B197FC" stroke-width="1.5"/>
  <text x="970" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#F8FAFC">Selector</text>
  <text x="970" y="369" text-anchor="middle" font-size="11" fill="#D4C5FF">matches?</text>
  <path d="M860 356 H780 V432" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="818" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="#A7F3D0">YES</text>
  <path d="M1080 356 H1135 V432" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="1112" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="#FDE68A">NO</text>
  <rect x="624" y="439" width="312" height="72" rx="12" fill="#182F36" stroke="#34D399" stroke-width="1.5"/>
  <text x="780" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#A7F3D0">Regular external function</text>
  <text x="780" y="490" text-anchor="middle" font-size="11" fill="#C4D2E7">Decode parameters and execute</text>
  <rect x="963" y="439" width="213" height="72" rx="12" fill="#302523" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="1069" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#FDE68A">fallback()</text>
  <text x="1069" y="490" text-anchor="middle" font-size="11" fill="#C4D2E7">If present and applicable</text>
  <rect x="44" y="548" width="1112" height="102" rx="14" fill="#101B2D" stroke="#405775"/>
  <text x="68" y="577" font-size="15" font-weight="700" fill="#F8FAFC">Important distinctions</text>
  <text x="68" y="601" font-size="12" fill="#C4D2E7">• Fallback is not a regular function selector. It needs payable to accept Ether.</text>
  <text x="68" y="623" font-size="12" fill="#C4D2E7">• A known selector with malformed arguments may revert during decoding; it does not automatically fall through to fallback.</text>
  <text x="68" y="641" font-size="12" fill="#C4D2E7">• The parameterized fallback return form returns raw bytes rather than ABI-encoding a bytes value.</text>
  <text x="44" y="688" font-size="11" fill="#91A8C7">Simplified routing diagram based on the Solidity fallback/receive rules.</text>
  <text x="44" y="710" font-size="11" fill="#91A8C7">Source: docs.solidity.org/en/latest/contracts.html#fallback-function</text>
</g>
</svg>
