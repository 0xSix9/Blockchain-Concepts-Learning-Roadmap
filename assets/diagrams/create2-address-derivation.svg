<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CREATE2 Address Derivation</title>
  <desc id="desc">A technical diagram showing the four byte components of the CREATE2 preimage, the 85-byte total, Keccak-256 hashing, and extracting the low 20 bytes for the final address.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.heading{font:700 26px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.label{font:700 17px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.mono{font:15px ui-monospace,Menlo,monospace;fill:#0f172a}.blue{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.teal{fill:#ccfbf1;stroke:#2dd4bf;stroke-width:2}.purple{fill:#ede9fe;stroke:#a78bfa;stroke-width:2}.amber{fill:#fef3c7;stroke:#fbbf24;stroke-width:2}.green{fill:#dcfce7;stroke:#4ade80;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720" rx="20"/>
  <text x="48" y="50" class="heading">CREATE2 Address Derivation</text>
  <text x="48" y="79" class="subtitle">EIP-1014 · The exact bytes that produce the predicted deployment address</text>

  <rect x="36" y="105" width="1128" height="270" rx="18" class="panel"/>
  <text x="60" y="141" class="label">1 · Build the 85-byte preimage</text>
  <rect x="62" y="166" width="105" height="112" rx="10" class="amber"/>
  <text x="114" y="194" text-anchor="middle" class="label">0xff</text>
  <text x="114" y="220" text-anchor="middle" class="small">1 byte</text>
  <text x="114" y="247" text-anchor="middle" class="small">Prefix</text>

  <rect x="181" y="166" width="205" height="112" rx="10" class="blue"/>
  <text x="283" y="194" text-anchor="middle" class="label">Deployer</text>
  <text x="283" y="220" text-anchor="middle" class="small">20 bytes</text>
  <text x="283" y="247" text-anchor="middle" class="small">CREATE2 executor</text>

  <rect x="400" y="166" width="205" height="112" rx="10" class="purple"/>
  <text x="502" y="194" text-anchor="middle" class="label">Salt</text>
  <text x="502" y="220" text-anchor="middle" class="small">32 bytes</text>
  <text x="502" y="247" text-anchor="middle" class="small">bytes32 value</text>

  <rect x="619" y="166" width="300" height="112" rx="10" class="teal"/>
  <text x="769" y="194" text-anchor="middle" class="label">keccak256(init_code)</text>
  <text x="769" y="220" text-anchor="middle" class="small">32 bytes</text>
  <text x="769" y="247" text-anchor="middle" class="small">Hash of exact init-code bytes</text>

  <path d="M168 222 H178" class="line"/>
  <path d="M387 222 H397" class="line"/>
  <path d="M606 222 H616" class="line"/>
  <text x="949" y="197" class="label">Total</text>
  <text x="949" y="227" class="mono">1 + 20 + 32 + 32</text>
  <text x="949" y="252" class="label">= 85 bytes</text>
  <text x="62" y="319" class="mono">0xff ++ deployer ++ salt ++ keccak256(init_code)</text>
  <text x="62" y="347" class="small">Fixed-width components make the preimage layout unambiguous.</text>

  <path d="M600 376 V408" class="line"/>
  <rect x="275" y="414" width="650" height="100" rx="16" class="purple"/>
  <text x="600" y="448" text-anchor="middle" class="label">Keccak-256 of the 85-byte preimage</text>
  <text x="600" y="479" text-anchor="middle" class="mono">bytes32 digest = keccak256(preimage)</text>

  <path d="M600 515 V547" class="line"/>
  <rect x="315" y="553" width="570" height="76" rx="16" class="green"/>
  <text x="600" y="583" text-anchor="middle" class="label">Take the low 20 bytes (rightmost 160 bits)</text>
  <text x="600" y="608" text-anchor="middle" class="mono">address(uint160(uint256(digest)))</text>

  <rect x="36" y="646" width="1128" height="49" rx="12" class="panel"/>
  <text x="600" y="676" text-anchor="middle" class="body">Chain ID is not an input · Correct prediction does not guarantee deployment success</text>
</svg>