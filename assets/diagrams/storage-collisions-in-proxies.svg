<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
  <title id="title">Storage Collisions in Proxies</title>
  <desc id="desc">Three storage collision classes are shown: proxy metadata versus implementation state, incompatible layouts between implementation versions, and colliding module or facet storage. ERC-1967 slots, layout validation, and unique namespaced storage are shown as mitigations.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.teal{fill:#ecfeff;stroke:#22d3ee;stroke-width:2}
      .gold{fill:#fffbeb;stroke:#f59e0b;stroke-width:2}.purple{fill:#f5f3ff;stroke:#a78bfa;stroke-width:2}
      .red{fill:#fef2f2;stroke:#f87171;stroke-width:2}
      .ink{fill:#0f172a;font-family:Inter,Arial,sans-serif}.muted{fill:#475569;font-family:Inter,Arial,sans-serif}
      .title{font-size:30px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px}
      .mono{fill:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600}
      .arrow{stroke:#2563eb;stroke-width:2.6;fill:none}.ok{stroke:#0f766e;stroke-width:2.6;fill:none}.bad{stroke:#dc2626;stroke-width:2.6;fill:none}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0f766e"/></marker>
    <marker id="bad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <rect class="bg" width="1200" height="870" rx="24"/>
  <text class="ink title" x="42" y="54">Storage Collisions in Proxies</text>
  <text class="muted body" x="44" y="84">Different code paths must not assign different meanings to the same storage slot.</text>

  <rect class="panel" x="35" y="112" width="1130" height="340" rx="20"/>
  <text class="ink head" x="65" y="148">1. Proxy metadata vs. implementation state</text>
  <rect class="red" x="70" y="174" width="310" height="98" rx="12"/>
  <text class="ink head" x="225" y="203" text-anchor="middle">Bad proxy: slot 0</text>
  <text class="mono" x="225" y="229" text-anchor="middle">implementation address</text>
  <text class="muted small" x="225" y="252" text-anchor="middle">routing pointer</text>
  <rect class="red" x="435" y="174" width="310" height="98" rx="12"/>
  <text class="ink head" x="590" y="203" text-anchor="middle">Logic: slot 0</text>
  <text class="mono" x="590" y="229" text-anchor="middle">owner</text>
  <text class="muted small" x="590" y="252" text-anchor="middle">application state</text>
  <path class="bad" d="M380 223 L427 223" marker-end="url(#bad)"/>
  <rect class="red" x="800" y="174" width="320" height="98" rx="12"/>
  <text class="ink head" x="960" y="203" text-anchor="middle">Collision consequence</text>
  <text class="muted body" x="960" y="229" text-anchor="middle">owner write overwrites</text>
  <text class="muted body" x="960" y="250" text-anchor="middle">the implementation pointer</text>
  <path class="bad" d="M745 223 L792 223" marker-end="url(#bad)"/>

  <rect class="teal" x="70" y="306" width="1050" height="106" rx="12"/>
  <text class="ink head" x="595" y="338" text-anchor="middle">Mitigation: ERC-1967 dedicated metadata slots</text>
  <text class="mono" x="595" y="365" text-anchor="middle">implementation pointer → standardized hash-derived slot</text>
  <text class="muted body" x="595" y="389" text-anchor="middle">Ordinary application variables use the compiler's normal layout; custom writes still require auditing.</text>

  <rect class="panel" x="35" y="478" width="1130" height="200" rx="20"/>
  <text class="ink head" x="65" y="516">2. Different implementation versions</text>
  <rect class="blue" x="70" y="541" width="300" height="86" rx="11"/>
  <text class="ink head" x="220" y="571" text-anchor="middle">V1 storage</text>
  <text class="mono" x="220" y="598" text-anchor="middle">slot 0 = owner</text>
  <rect class="red" x="435" y="541" width="300" height="86" rx="11"/>
  <text class="ink head" x="585" y="571" text-anchor="middle">Incompatible V2</text>
  <text class="mono" x="585" y="598" text-anchor="middle">slot 0 = lastContributor</text>
  <path class="bad" d="M370 584 L427 584" marker-end="url(#bad)"/>
  <rect class="gold" x="800" y="541" width="320" height="86" rx="11"/>
  <text class="ink head" x="960" y="571" text-anchor="middle">Prevention</text>
  <text class="muted body" x="960" y="598" text-anchor="middle">layout validation + migration tests</text>
  <path class="ok" d="M735 584 L792 584" marker-end="url(#ok)"/>
  <text class="muted small" x="70" y="653">ERC-1967 protects metadata placement; it does not make V1 and V2 application layouts compatible.</text>

  <rect class="panel" x="35" y="704" width="1130" height="132" rx="20"/>
  <text class="ink head" x="65" y="742">3. Module and facet storage</text>
  <rect class="purple" x="70" y="760" width="300" height="52" rx="10"/>
  <text class="ink mono" x="220" y="791" text-anchor="middle">Module A → slot / namespace X</text>
  <rect class="purple" x="435" y="760" width="300" height="52" rx="10"/>
  <text class="ink mono" x="585" y="791" text-anchor="middle">Module B → same X (unsafe)</text>
  <path class="bad" d="M370 786 L427 786" marker-end="url(#bad)"/>
  <rect class="teal" x="800" y="760" width="320" height="52" rx="10"/>
  <text class="ink head" x="960" y="791" text-anchor="middle">Use coordinated / unique layouts</text>
</svg>