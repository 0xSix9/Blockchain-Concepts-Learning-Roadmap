<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">How the Ethereum ABI connects clients and contracts</title>
<desc id="desc">A compiler produces a JSON ABI. A client uses it to encode calldata with a four-byte selector and encoded arguments. The contract's bytecode dispatches the call and returns ABI bytes, emits logs, or produces revert data that the client decodes with the ABI.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D19"/><stop offset="1" stop-color="#14213B"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8CA8D6"/></marker>
</defs>
<rect width="1200" height="650" rx="22" fill="url(#bg)"/>
<text x="44" y="42" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#74C0FC">ABI · CONTRACT INTERACTION</text>
<text x="44" y="80" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#F8FAFC">From typed interface to raw bytes—and back</text>
<g font-family="Arial,sans-serif">
  <rect x="44" y="118" width="310" height="100" rx="14" fill="#18263C" stroke="#6EA8FE" stroke-width="1.5"/>
  <text x="66" y="150" font-size="16" font-weight="700" fill="#F8FAFC">1 · Solidity source</text>
  <text x="66" y="176" font-size="13" fill="#C4D2E7">Functions · events · errors</text>
  <text x="66" y="198" font-size="12" fill="#91A8C7">Compiled contract interface</text>
  <rect x="445" y="118" width="310" height="100" rx="14" fill="#1D2C40" stroke="#B197FC" stroke-width="1.5"/>
  <text x="467" y="150" font-size="16" font-weight="700" fill="#F8FAFC">2 · JSON ABI</text>
  <text x="467" y="176" font-size="13" fill="#D4C5FF">Names and canonical types</text>
  <text x="467" y="198" font-size="12" fill="#B5C2DA">Interface schema—not bytecode</text>
  <path d="M354 168 H438" stroke="#8CA8D6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="396" y="153" text-anchor="middle" font-size="11" fill="#AFC2E4">compiler</text>
  <rect x="846" y="118" width="310" height="100" rx="14" fill="#18263C" stroke="#34D399" stroke-width="1.5"/>
  <text x="868" y="150" font-size="16" font-weight="700" fill="#F8FAFC">3 · Client / wallet</text>
  <text x="868" y="176" font-size="13" fill="#A7F3D0">Select method + arguments</text>
  <text x="868" y="198" font-size="12" fill="#C4D2E7">Encode and later decode bytes</text>
  <path d="M755 168 H839" stroke="#8CA8D6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="797" y="153" text-anchor="middle" font-size="11" fill="#AFC2E4">uses</text>
  <path d="M1001 218 V258" stroke="#8CA8D6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="846" y="266" width="310" height="86" rx="14" fill="#202B40" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="868" y="296" font-size="15" font-weight="700" fill="#F8FAFC">Calldata bytes</text>
  <text x="868" y="320" font-size="13" fill="#FDE68A">4-byte selector + encoded arguments</text>
  <text x="868" y="339" font-size="11" fill="#C4D2E7">No human-readable names on-chain</text>
  <path d="M846 309 H738 V399 H654" stroke="#8CA8D6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="763" y="292" text-anchor="middle" font-size="11" fill="#AFC2E4">call data</text>
  <rect x="345" y="365" width="390" height="116" rx="14" fill="#18263C" stroke="#74C0FC" stroke-width="1.5"/>
  <text x="369" y="397" font-size="16" font-weight="700" fill="#F8FAFC">4 · Contract bytecode / EVM</text>
  <text x="369" y="423" font-size="13" fill="#C4D2E7">Dispatch code checks the selector</text>
  <text x="369" y="445" font-size="13" fill="#C4D2E7">and executes matching logic</text>
  <text x="369" y="465" font-size="11" fill="#91A8C7">The EVM does not read the JSON ABI</text>
  <path d="M540 481 V512" stroke="#8CA8D6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="557" y="502" font-size="11" fill="#AFC2E4">outputs / side effects</text>
  <rect x="44" y="520" width="345" height="84" rx="12" fill="#18263C" stroke="#34D399"/>
  <text x="64" y="549" font-size="14" font-weight="700" fill="#A7F3D0">Return data</text>
  <text x="64" y="573" font-size="12" fill="#C4D2E7">Encoded output values; no selector</text>
  <rect x="428" y="520" width="345" height="84" rx="12" fill="#18263C" stroke="#60A5FA"/>
  <text x="448" y="549" font-size="14" font-weight="700" fill="#93C5FD">Event logs</text>
  <text x="448" y="573" font-size="12" fill="#C4D2E7">Topics + data, decoded using event ABI</text>
  <rect x="812" y="520" width="344" height="84" rx="12" fill="#18263C" stroke="#F87171"/>
  <text x="832" y="549" font-size="14" font-weight="700" fill="#FCA5A5">Revert data</text>
  <text x="832" y="573" font-size="12" fill="#C4D2E7">Often error selector + encoded arguments</text>
  <path d="M540 481 V501 H216 V513" stroke="#8CA8D6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M540 501 H600 V513" stroke="#8CA8D6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M540 501 H984 V513" stroke="#8CA8D6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="44" y="630" font-size="11" fill="#91A8C7">ABI is the schema clients use to interpret bytes; it is not a guarantee that a target address implements the described interface.</text>
</g>
</svg>
