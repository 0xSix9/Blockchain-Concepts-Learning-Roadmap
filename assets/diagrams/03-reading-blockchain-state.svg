<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Reading Blockchain State</title><desc id="desc">A state read is meaningful only in its chosen block context.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53627a"/></marker><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.ttl{font-size:28px;font-weight:750;fill:#172033}.sub{font-size:15px;fill:#526078}.foot{font-size:15px;fill:#526078}</style></defs><rect width="1200" height="500" fill="#f7f9fc"/><text x="60" y="60" class="ttl">Reading Blockchain State</text><text x="60" y="91" class="sub">A state read is meaningful only in its chosen block context.</text><rect x="60" y="180" width="245" height="178" rx="18" fill="#eaf2ff" stroke="#7aa5ec" stroke-width="2"/><text x="82" y="217" font-size="18" font-weight="700" fill="#172033">Choose state</text><text x="82" y="253" font-size="14" fill="#172033">latest / safe</text><text x="82" y="280" font-size="14" fill="#172033">finalized / block hash</text><text x="82" y="307" font-size="14" fill="#172033">Pin a block</text><path d="M305 268 H338" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="345" y="180" width="245" height="178" rx="18" fill="#fff3dc" stroke="#e0ac49" stroke-width="2"/><text x="367" y="217" font-size="18" font-weight="700" fill="#172033">Query</text><text x="367" y="253" font-size="14" fill="#172033">balance / nonce</text><text x="367" y="280" font-size="14" fill="#172033">code / storage</text><text x="367" y="307" font-size="14" fill="#172033">RPC method</text><path d="M590 268 H623" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="630" y="180" width="245" height="178" rx="18" fill="#e3f7ee" stroke="#5bbd92" stroke-width="2"/><text x="652" y="217" font-size="18" font-weight="700" fill="#172033">Node response</text><text x="652" y="253" font-size="14" fill="#172033">quantity / data</text><text x="652" y="280" font-size="14" fill="#172033">or proof material</text><text x="652" y="307" font-size="14" fill="#172033">Endpoint trust</text><path d="M875 268 H908" stroke="#53627a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="915" y="180" width="245" height="178" rx="18" fill="#f1eafe" stroke="#a88be8" stroke-width="2"/><text x="937" y="217" font-size="18" font-weight="700" fill="#172033">Application</text><text x="937" y="253" font-size="14" fill="#172033">validate encoding</text><text x="937" y="280" font-size="14" fill="#172033">record block hash</text><text x="937" y="307" font-size="14" fill="#172033">use result</text><rect x="60" y="405" width="1080" height="55" rx="13" fill="#fff" stroke="#d7dee9"/><text x="82" y="438" class="foot">For reproducible reads, use a consistent block reference and verify proofs when your threat model requires them.</text></svg>