<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">Mappings and Dynamic Arrays in Solidity Storage</title>
  <desc id="desc">Three panels explain hash-derived mapping locations, dynamic arrays with a length slot and hashed data base, and the inline versus long encodings of bytes and string.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .teal { fill: #ecfeff; stroke: #22d3ee; stroke-width: 1.5; }
      .gold { fill: #fffbeb; stroke: #fbbf24; stroke-width: 1.5; }
      .rose { fill: #fff1f2; stroke: #fb7185; stroke-width: 1.5; }
      .ink { fill: #0f172a; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #475569; font-family: Inter, Arial, sans-serif; }
      .heading { font-size: 23px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .mono { font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 4; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="820" rx="24"/>
  <text class="ink heading" x="48" y="50">Mappings &amp; Dynamic Arrays in Storage</text>
  <text class="muted body" x="48" y="78">Declarations reserve base slots; Keccak-256 derives where data is actually stored.</text>

  <rect class="panel" x="40" y="108" width="1020" height="218" rx="16"/>
  <text class="ink label" x="64" y="143">1. Mapping: key + base slot → derived entry slot</text>
  <rect class="blue" x="64" y="166" width="210" height="68" rx="10"/>
  <text class="ink label" x="82" y="192">Key k</text>
  <text class="muted small" x="82" y="215">e.g. padded address</text>
  <text class="ink label" x="64" y="263">Mapping base p</text>
  <rect class="gold" x="178" y="246" width="96" height="42" rx="8"/>
  <text class="ink mono" x="201" y="272">slot p</text>
  <path class="line" d="M274 201 L315 201" marker-end="url(#arrow)"/>
  <path class="line" d="M274 267 L315 267" marker-end="url(#arrow)"/>
  <rect class="teal" x="326" y="176" width="292" height="106" rx="12"/>
  <text class="ink label" x="348" y="204">Encode then hash</text>
  <text class="ink mono" x="348" y="231">keccak256(h(k) || p)</text>
  <text class="muted small" x="348" y="258">h(k) depends on the key type.</text>
  <path class="line" d="M618 229 L662 229" marker-end="url(#arrow)"/>
  <rect class="rose" x="674" y="176" width="350" height="106" rx="12"/>
  <text class="ink label" x="696" y="204">Derived entry slot</text>
  <text class="muted body" x="696" y="229">Contains the value or starts</text>
  <text class="muted body" x="696" y="250">the mapped struct/array data.</text>
  <text class="muted small" x="64" y="307">The mapping base slot anchors the formula; it does not hold a list of its key-value entries.</text>

  <rect class="panel" x="40" y="346" width="1020" height="234" rx="16"/>
  <text class="ink label" x="64" y="381">2. Dynamic array: length at p, data begins at keccak256(p)</text>
  <rect class="gold" x="64" y="402" width="200" height="70" rx="10"/>
  <text class="ink label" x="82" y="429">Base slot p</text>
  <text class="muted body" x="82" y="452">length = 3</text>
  <path class="line" d="M264 437 L302 437" marker-end="url(#arrow)"/>
  <rect class="teal" x="314" y="402" width="220" height="70" rx="10"/>
  <text class="ink label" x="334" y="429">Hash base slot</text>
  <text class="ink mono" x="334" y="452">dataBase = H(p)</text>
  <path class="line" d="M534 437 L572 437" marker-end="url(#arrow)"/>
  <rect class="blue" x="584" y="402" width="440" height="70" rx="10"/>
  <text class="ink label" x="604" y="429">Element data area</text>
  <text class="muted body" x="604" y="452">Full-width types: one element per slot</text>

  <text class="muted body" x="64" y="510">uint256[]: element i → dataBase + i</text>
  <rect class="blue" x="64" y="523" width="280" height="36" rx="7"/>
  <text class="ink small" x="78" y="546">Slot B: element 0</text>
  <rect class="blue" x="352" y="523" width="280" height="36" rx="7"/>
  <text class="ink small" x="366" y="546">Slot B+1: element 1</text>
  <rect class="blue" x="640" y="523" width="280" height="36" rx="7"/>
  <text class="ink small" x="654" y="546">Slot B+2: element 2</text>
  <text class="muted small" x="64" y="572">Smaller element types (e.g. uint8[]) may pack multiple elements in each data slot.</text>

  <rect class="panel" x="40" y="600" width="1020" height="172" rx="16"/>
  <text class="ink label" x="64" y="635">3. Special case: bytes and string</text>
  <rect class="teal" x="64" y="654" width="454" height="86" rx="10"/>
  <text class="ink label" x="84" y="680">0–31 bytes: inline</text>
  <rect x="84" y="693" width="414" height="25" rx="4" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="84" y="693" width="362" height="25" rx="4" fill="#93c5fd" stroke="#3b82f6"/>
  <rect x="446" y="693" width="52" height="25" rx="4" fill="#fde68a" stroke="#d97706"/>
  <text class="ink small" x="93" y="710">data in high-order bytes</text>
  <text class="ink small" x="451" y="710">len×2</text>
  <rect class="rose" x="546" y="654" width="478" height="86" rx="10"/>
  <text class="ink label" x="566" y="680">32 bytes or more: separate data</text>
  <text class="ink mono" x="566" y="706">slot p: length × 2 + 1</text>
  <text class="muted small" x="566" y="727">Content begins at keccak256(p)</text>
  <text class="muted small" x="52" y="802">Conceptual diagram. Confirm each base slot and type-specific rule using the exact Solidity layout and documentation.</text>
</svg>