<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ethereum Transaction Lifecycle</title>
  <desc id="desc">Flow diagram from transaction preparation, signing, RPC submission and propagation through pending transaction pool, block inclusion, execution, receipt, confirmations and finality, with branches for rejection, delay, or reverted execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 27px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.label{font:700 17px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#334155}.small{font:12px Arial,sans-serif;fill:#475569}.blue{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.purple{fill:#ede9fe;stroke:#a78bfa;stroke-width:2}.teal{fill:#ccfbf1;stroke:#2dd4bf;stroke-width:2}.amber{fill:#fef3c7;stroke:#fbbf24;stroke-width:2}.green{fill:#dcfce7;stroke:#4ade80;stroke-width:2}.red{fill:#fee2e2;stroke:#f87171;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.dashed{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760" rx="20"/>
  <text x="42" y="48" class="title">Ethereum Transaction Lifecycle</text>
  <text x="42" y="76" class="subtitle">Submission is not inclusion · Inclusion is not execution success · Execution success is not finality</text>

  <rect x="30" y="104" width="1140" height="462" rx="18" class="panel"/>
  <text x="56" y="137" class="label">1 · Prepare, submit, include, execute</text>

  <rect x="60" y="166" width="238" height="90" rx="13" class="blue"/>
  <text x="179" y="195" text-anchor="middle" class="label">Prepare transaction</text>
  <text x="179" y="219" text-anchor="middle" class="body">to / value / data</text>
  <text x="179" y="239" text-anchor="middle" class="body">nonce / gas / fees / chain ID</text>

  <path d="M299 211 H333" class="line"/>
  <rect x="339" y="166" width="190" height="90" rx="13" class="purple"/>
  <text x="434" y="197" text-anchor="middle" class="label">Sign</text>
  <text x="434" y="221" text-anchor="middle" class="body">Private key</text>
  <text x="434" y="241" text-anchor="middle" class="small">Signed serialized bytes</text>

  <path d="M530 211 H563" class="line"/>
  <rect x="569" y="166" width="205" height="90" rx="13" class="teal"/>
  <text x="671" y="196" text-anchor="middle" class="label">Submit / propagate</text>
  <text x="671" y="220" text-anchor="middle" class="body">eth_sendRawTransaction</text>
  <text x="671" y="240" text-anchor="middle" class="small">Hash ≠ confirmation</text>

  <path d="M775 211 H808" class="line"/>
  <rect x="814" y="166" width="300" height="90" rx="13" class="amber"/>
  <text x="964" y="196" text-anchor="middle" class="label">Pending transaction pool</text>
  <text x="964" y="220" text-anchor="middle" class="body">Local node policies / waiting</text>
  <text x="964" y="240" text-anchor="middle" class="small">May wait, be dropped, or replaced</text>

  <path d="M964 257 V299" class="line"/>
  <rect x="814" y="305" width="300" height="92" rx="13" class="blue"/>
  <text x="964" y="336" text-anchor="middle" class="label">Included in a block</text>
  <text x="964" y="360" text-anchor="middle" class="body">Ordered with other transactions</text>
  <text x="964" y="380" text-anchor="middle" class="small">Inclusion is not finality</text>

  <path d="M813 351 H777" class="line"/>
  <rect x="464" y="305" width="307" height="92" rx="13" class="purple"/>
  <text x="617" y="336" text-anchor="middle" class="label">Execute in EVM</text>
  <text x="617" y="360" text-anchor="middle" class="body">Apply state transition</text>
  <text x="617" y="380" text-anchor="middle" class="small">Success or revert</text>

  <path d="M464 351 H428" class="line"/>
  <rect x="60" y="305" width="362" height="92" rx="13" class="teal"/>
  <text x="241" y="335" text-anchor="middle" class="label">Receipt becomes available</text>
  <text x="241" y="359" text-anchor="middle" class="body">status · gasUsed · logs · block</text>
  <text x="241" y="379" text-anchor="middle" class="small">Check status; receipt can report failure</text>

  <path d="M241 398 V435 H434" class="line"/>
  <rect x="440" y="420" width="333" height="94" rx="13" class="green"/>
  <text x="606" y="450" text-anchor="middle" class="label">More confirmations</text>
  <text x="606" y="474" text-anchor="middle" class="body">Watch canonical chain progress</text>
  <text x="606" y="494" text-anchor="middle" class="small">Reorganizations can change inclusion</text>

  <path d="M774 467 H814" class="line"/>
  <rect x="820" y="420" width="294" height="94" rx="13" class="green"/>
  <text x="967" y="450" text-anchor="middle" class="label">Finalized</text>
  <text x="967" y="474" text-anchor="middle" class="body">Consensus finality reached</text>
  <text x="967" y="494" text-anchor="middle" class="small">Stronger assurance than inclusion</text>

  <path d="M964 257 V277 H1127 V146 H1060" class="dashed"/>
  <text x="1032" y="293" text-anchor="middle" class="small">No guarantee</text>

  <rect x="30" y="586" width="1140" height="142" rx="18" class="panel"/>
  <text x="56" y="619" class="label">2 · Keep these outcomes separate</text>

  <rect x="60" y="640" width="330" height="64" rx="11" class="red"/>
  <text x="225" y="665" text-anchor="middle" class="label">Rejected / not included</text>
  <text x="225" y="687" text-anchor="middle" class="small">No on-chain execution receipt yet</text>

  <rect x="435" y="640" width="330" height="64" rx="11" class="amber"/>
  <text x="600" y="665" text-anchor="middle" class="label">Included but reverted</text>
  <text x="600" y="687" text-anchor="middle" class="small">Receipt exists; status = 0</text>

  <rect x="810" y="640" width="330" height="64" rx="11" class="green"/>
  <text x="975" y="665" text-anchor="middle" class="label">Included and successful</text>
  <text x="975" y="687" text-anchor="middle" class="small">Receipt exists; status = 1</text>
</svg>