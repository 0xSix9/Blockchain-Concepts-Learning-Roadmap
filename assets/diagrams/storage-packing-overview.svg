<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Storage Packing: Slot Usage and Gas Trade-offs</title>
  <desc id="desc">Comparison of fields packed into one 32-byte storage slot and different declaration orders that use two or three slots. The diagram highlights that fewer slots do not always guarantee lower gas.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .teal { fill: #ecfeff; stroke: #22d3ee; stroke-width: 1.5; }
      .gold { fill: #fffbeb; stroke: #fbbf24; stroke-width: 1.5; }
      .rose { fill: #fff1f2; stroke: #fb7185; stroke-width: 1.5; }
      .ink { fill: #0f172a; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #475569; font-family: Inter, Arial, sans-serif; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .mono { font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="760" rx="24"/>
  <text class="ink heading" x="48" y="50">Storage Packing: Fit Fields into 32 Bytes</text>
  <text class="muted body" x="48" y="78">Packing follows Solidity's layout rules and declaration order—it is not a free reordering pass.</text>

  <rect class="panel" x="48" y="110" width="1004" height="224" rx="16"/>
  <text class="ink label" x="72" y="143">Example: PackedExample</text>
  <text class="muted body" x="72" y="166">Slot 0 contains four small values (26 bytes total); slot 1 holds the full-width uint256.</text>
  <text class="muted small" x="72" y="198">SLOT 0 · 32 BYTES</text>
  <rect x="72" y="210" width="460" height="42" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="72" y="210" width="230" height="42" rx="5" fill="#93c5fd" stroke="#3b82f6"/>
  <rect x="302" y="210" width="115" height="42" fill="#67e8f9" stroke="#0891b2"/>
  <rect x="417" y="210" width="14.375" height="42" fill="#fde68a" stroke="#d97706"/>
  <rect x="431.375" y="210" width="14.375" height="42" fill="#fda4af" stroke="#e11d48"/>
  <rect x="445.75" y="210" width="86.25" height="42" rx="4" fill="#e2e8f0" stroke="#64748b"/>
  <text class="ink small" x="126" y="235">uint128 credit · 16B</text>
  <text class="ink small" x="310" y="235">uint64 · 8B</text>
  <path class="line" d="M424 252 L424 266 L380 266"/>
  <text class="muted small" x="280" y="285">bool + uint8 = 2B</text>
  <text class="muted small" x="72" y="313">Offsets: 0 · 16 · 24 · 25 bytes</text>
  <rect class="gold" x="590" y="196" width="430" height="88" rx="12"/>
  <text class="ink label" x="614" y="224">Slot 1</text>
  <text class="ink mono" x="614" y="251">uint256 total · 32 bytes · offset 0</text>
  <text class="muted small" x="614" y="272">Slot boundary reached after the full-width field.</text>

  <rect class="panel" x="48" y="356" width="486" height="210" rx="16"/>
  <text class="ink label" x="72" y="390">Less efficient ordering: 3 slots</text>
  <text class="muted small" x="72" y="414">uint128 first; uint256 total; uint128 last;</text>
  <rect class="blue" x="72" y="432" width="438" height="32" rx="6"/>
  <rect x="72" y="432" width="219" height="32" rx="6" fill="#93c5fd" stroke="#3b82f6"/>
  <text class="ink small" x="86" y="453">Slot 0: first (16B) + 16B unused</text>
  <rect class="gold" x="72" y="473" width="438" height="32" rx="6"/>
  <text class="ink small" x="86" y="494">Slot 1: total (32B)</text>
  <rect class="rose" x="72" y="514" width="438" height="32" rx="6"/>
  <text class="ink small" x="86" y="535">Slot 2: last (16B) + 16B unused</text>

  <rect class="panel" x="566" y="356" width="486" height="210" rx="16"/>
  <text class="ink label" x="590" y="390">Grouped ordering: 2 slots</text>
  <text class="muted small" x="590" y="414">uint128 first; uint128 last; uint256 total;</text>
  <rect class="blue" x="590" y="432" width="438" height="48" rx="6"/>
  <rect x="590" y="432" width="219" height="48" rx="6" fill="#93c5fd" stroke="#3b82f6"/>
  <rect x="809" y="432" width="219" height="48" rx="6" fill="#67e8f9" stroke="#0891b2"/>
  <text class="ink small" x="607" y="461">first · 16B</text>
  <text class="ink small" x="832" y="461">last · 16B</text>
  <rect class="gold" x="590" y="490" width="438" height="48" rx="6"/>
  <text class="ink small" x="607" y="519">Slot 1: total · 32B</text>

  <rect class="teal" x="48" y="588" width="1004" height="110" rx="16"/>
  <text class="ink label" x="72" y="621">Gas reality check</text>
  <text class="muted body" x="72" y="648">Fewer occupied slots can help, but packed writes may need masking or read-modify-write logic.</text>
  <text class="muted body" x="72" y="674">Benchmark realistic reads and writes with the exact compiler and EVM target.</text>
  <text class="muted small" x="52" y="730">Illustrative layouts. Verify actual slot and offset assignments with compiler storage-layout output.</text>
</svg>