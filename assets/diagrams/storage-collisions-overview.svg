<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Storage Collisions and Namespaced Storage</title>
  <desc id="desc">The left panel shows an unsafe proxy and an implementation treating slot zero as different values, causing the proxy implementation address to be overwritten by delegated code. The right panel shows separate storage namespaces and standard proxy metadata slots reducing accidental overlap.</desc>
  <defs>
    <style>
      .bg{fill:#f6f8fc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .ink{fill:#182236;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
      .muted{fill:#5b6880;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
      .h1{font-size:30px;font-weight:800;letter-spacing:1px}.h2{font-size:19px;font-weight:750}
      .body{font-size:16px}.small{font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
      .blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.teal{fill:#ccfbf1;stroke:#0f766e;stroke-width:2}
      .amber{fill:#fef3c7;stroke:#b45309;stroke-width:2}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:2}
      .red{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none}
      .arrowred{stroke:#b91c1c;stroke-width:2.5;fill:none;marker-end:url(#redarrow)}
      .arrowteal{stroke:#0f766e;stroke-width:2.5;fill:none;marker-end:url(#tealarrow)}
    </style>
    <marker id="redarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/></marker>
    <marker id="tealarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700" rx="24"/>
  <text class="ink h1" x="48" y="54">STORAGE COLLISIONS</text>
  <text class="muted body" x="50" y="82">Same account context + same slot key + different meanings = state corruption risk</text>
  <rect class="panel" x="40" y="108" width="548" height="442" rx="16"/>
  <rect class="panel" x="612" y="108" width="548" height="442" rx="16"/>
  <rect class="red" x="64" y="132" width="500" height="54" rx="10"/>
  <text class="ink h2" x="314" y="165" text-anchor="middle">Unsafe: both expect slot 0</text>
  <text class="muted small" x="64" y="211">Proxy metadata</text>
  <rect class="blue" x="64" y="222" width="220" height="74" rx="10"/>
  <text class="ink h2" x="174" y="249" text-anchor="middle">Proxy</text>
  <text class="ink mono" x="174" y="273" text-anchor="middle">slot 0 = implementation</text>
  <text class="muted small" x="316" y="211">Delegated implementation code</text>
  <rect class="amber" x="316" y="222" width="248" height="74" rx="10"/>
  <text class="ink h2" x="440" y="249" text-anchor="middle">Implementation</text>
  <text class="ink mono" x="440" y="273" text-anchor="middle">slot 0 = totalSupply</text>
  <path class="arrowred" d="M440 296 V324 H174 V306"/>
  <text class="ink body" x="314" y="347" text-anchor="middle">DELEGATECALL writes slot 0</text>
  <rect class="red" x="94" y="368" width="440" height="78" rx="10"/>
  <text class="ink h2" x="314" y="398" text-anchor="middle">Collision</text>
  <text class="muted body" x="314" y="423" text-anchor="middle">totalSupply overwrites implementation address</text>
  <text class="muted small" x="64" y="488">No hash collision is required: the layout conflict is enough.</text>
  <text class="muted small" x="64" y="512">Other risks: upgrade layout changes and conflicting facets.</text>
  <rect class="teal" x="636" y="132" width="500" height="54" rx="10"/>
  <text class="ink h2" x="886" y="165" text-anchor="middle">Safer: explicit storage separation</text>
  <text class="muted small" x="636" y="211">Standard proxy metadata</text>
  <rect class="blue" x="636" y="222" width="220" height="74" rx="10"/>
  <text class="ink h2" x="746" y="249" text-anchor="middle">EIP-1967 slot</text>
  <text class="ink mono" x="746" y="273" text-anchor="middle">implementation address</text>
  <text class="muted small" x="888" y="211">Namespaced application state</text>
  <rect class="violet" x="888" y="222" width="248" height="74" rx="10"/>
  <text class="ink h2" x="1012" y="249" text-anchor="middle">ERC-7201 / ERC-8042</text>
  <text class="ink mono" x="1012" y="273" text-anchor="middle">unique namespace root</text>
  <path class="arrowteal" d="M746 296 V323 H1012 V306"/>
  <text class="ink body" x="886" y="347" text-anchor="middle">Distinct, documented storage regions</text>
  <rect class="teal" x="666" y="368" width="440" height="78" rx="10"/>
  <text class="ink h2" x="886" y="398" text-anchor="middle">Reduced overlap risk</text>
  <text class="muted body" x="886" y="423" text-anchor="middle">Still requires compatible upgrades and unique IDs</text>
  <text class="muted small" x="636" y="488">Compare compiler layouts and inspect custom assembly slots.</text>
  <text class="muted small" x="636" y="512">Namespaces do not automatically validate the code using them.</text>
  <rect class="panel" x="40" y="572" width="1120" height="92" rx="14"/>
  <text class="ink h2" x="64" y="607">Audit rule</text>
  <text class="ink body" x="64" y="634">Check storage context, slot key, data type, namespace owner, and upgrade history together.</text>
  <text class="muted small" x="64" y="652">EIP-1967 isolates common proxy metadata; ERC-7201 / ERC-8042 help organize module storage.</text>
</svg>