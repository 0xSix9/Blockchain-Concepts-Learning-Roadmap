<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">EVM Stack, Memory, and Calldata</title>
<desc id="desc">Three distinct EVM data areas: a last-in first-out stack of 256-bit words, byte-addressable temporary memory that can be read and written, and byte-addressable read-only calldata supplied to the current call.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#14213B"/></linearGradient></defs>
<rect width="1200" height="600" rx="24" fill="url(#bg)"/>
<g font-family="Arial,sans-serif">
<text x="40" y="44" font-size="12" font-weight="700" letter-spacing="2.5" fill="#74C0FC">STAGE 01 · EVM EXECUTION</text>
<text x="40" y="82" font-size="30" font-weight="700" fill="#F8FAFC">Three data areas, three different jobs</text>
<text x="40" y="108" font-size="15" fill="#BAC8DD">Understand where values come from, where they are processed, and how opcodes access them.</text>
<rect x="40" y="145" width="340" height="360" rx="16" fill="#101D31" stroke="#63E6BE" stroke-width="1.5"/><rect x="40" y="145" width="340" height="58" rx="16" fill="#173A38"/>
<text x="62" y="181" font-size="22" font-weight="700" fill="#D8FFF2">1. Stack</text><text x="62" y="231" font-size="13" font-weight="700" fill="#63E6BE">LIFO · TOP-FIRST OPERATIONS</text>
<rect x="82" y="254" width="218" height="49" rx="7" fill="#1D4D48" stroke="#63E6BE"/><text x="191" y="284" font-size="14" font-weight="700" fill="#F0FFFA" text-anchor="middle">Top → 5</text>
<rect x="82" y="310" width="218" height="49" rx="7" fill="#182F3A" stroke="#4E9F91"/><text x="191" y="340" font-size="14" fill="#D6F5EF" text-anchor="middle">3</text>
<rect x="82" y="366" width="218" height="49" rx="7" fill="#182F3A" stroke="#4E9F91"/><text x="191" y="396" font-size="14" fill="#D6F5EF" text-anchor="middle">2</text>
<text x="62" y="448" font-size="12" fill="#BAC8DD">Each item is 32 bytes (256 bits).</text><text x="62" y="470" font-size="12" fill="#BAC8DD">Maximum depth: 1,024 items.</text>
<rect x="430" y="145" width="340" height="360" rx="16" fill="#101D31" stroke="#74C0FC" stroke-width="1.5"/><rect x="430" y="145" width="340" height="58" rx="16" fill="#193451"/>
<text x="452" y="181" font-size="22" font-weight="700" fill="#E3F2FF">2. Memory</text><text x="452" y="231" font-size="13" font-weight="700" fill="#74C0FC">TEMPORARY · READ / WRITE</text><text x="452" y="260" font-size="12" fill="#BAC8DD">Byte-addressable offsets</text>
<rect x="452" y="277" width="31" height="52" rx="3" fill="#234F77" stroke="#74C0FC"/><text x="467" y="307" font-size="10" fill="#F8FAFC" text-anchor="middle">00</text><rect x="487" y="277" width="31" height="52" rx="3" fill="#234F77" stroke="#74C0FC"/><text x="502" y="307" font-size="10" fill="#F8FAFC" text-anchor="middle">01</text><rect x="522" y="277" width="31" height="52" rx="3" fill="#234F77" stroke="#74C0FC"/><text x="537" y="307" font-size="10" fill="#F8FAFC" text-anchor="middle">02</text><rect x="557" y="277" width="31" height="52" rx="3" fill="#234F77" stroke="#74C0FC"/><text x="572" y="307" font-size="10" fill="#F8FAFC" text-anchor="middle">03</text><rect x="592" y="277" width="31" height="52" rx="3" fill="#182D45" stroke="#74C0FC" stroke-opacity=".55"/><text x="607" y="307" font-size="10" fill="#F8FAFC" text-anchor="middle">04</text><rect x="627" y="277" width="31" height="52" rx="3" fill="#182D45" stroke="#74C0FC" stroke-opacity=".55"/><text x="642" y="307" font-size="10" fill="#F8FAFC" text-anchor="middle">05</text><rect x="662" y="277" width="31" height="52" rx="3" fill="#182D45" stroke="#74C0FC" stroke-opacity=".55"/><text x="677" y="307" font-size="10" fill="#F8FAFC" text-anchor="middle">06</text><rect x="697" y="277" width="31" height="52" rx="3" fill="#182D45" stroke="#74C0FC" stroke-opacity=".55"/><text x="712" y="307" font-size="10" fill="#F8FAFC" text-anchor="middle">07</text>
<path d="M452 345 H732" stroke="#496581" stroke-width="1"/><text x="452" y="374" font-size="12" fill="#BAC8DD">MSTORE writes a 32-byte word.</text><text x="452" y="397" font-size="12" fill="#BAC8DD">Expansion adds gas cost.</text><text x="452" y="448" font-size="12" fill="#BAC8DD">Fresh per execution frame.</text><text x="452" y="470" font-size="12" fill="#BAC8DD">Not persistent contract state.</text>
<rect x="820" y="145" width="340" height="360" rx="16" fill="#101D31" stroke="#B197FC" stroke-width="1.5"/><rect x="820" y="145" width="340" height="58" rx="16" fill="#302448"/>
<text x="842" y="181" font-size="22" font-weight="700" fill="#F1E8FF">3. Calldata</text><text x="842" y="231" font-size="13" font-weight="700" fill="#B197FC">INPUT BYTES · READ ONLY</text><text x="842" y="260" font-size="12" fill="#BAC8DD">Example external ABI call</text>
<rect x="842" y="278" width="96" height="58" rx="5" fill="#533E78" stroke="#B197FC"/><text x="890" y="300" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="middle">Selector</text><text x="890" y="318" font-size="10" fill="#E7DAFF" text-anchor="middle">4 bytes</text><rect x="944" y="278" width="190" height="58" rx="5" fill="#25314C" stroke="#8F7ADB"/><text x="1039" y="300" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="middle">ABI arguments</text><text x="1039" y="318" font-size="10" fill="#DCD3F2" text-anchor="middle">Static or dynamic</text>
<text x="842" y="374" font-size="12" fill="#BAC8DD">CALLDATALOAD reads 32 bytes.</text><text x="842" y="397" font-size="12" fill="#BAC8DD">CALLDATACOPY can copy to memory.</text><text x="842" y="448" font-size="12" fill="#BAC8DD">A callee has its own call input.</text><text x="842" y="470" font-size="12" fill="#BAC8DD">EVM opcodes cannot modify it.</text>
<rect x="40" y="530" width="1120" height="42" rx="10" fill="#111B2D" stroke="#34465F"/><text x="60" y="556" font-size="13" font-weight="700" fill="#F8FAFC">Keep separate:</text><text x="160" y="556" font-size="13" fill="#C7D4E7">Stack = operands</text><text x="365" y="556" font-size="13" fill="#C7D4E7">Memory = working bytes</text><text x="635" y="556" font-size="13" fill="#C7D4E7">Calldata = input bytes</text><text x="887" y="556" font-size="13" fill="#C7D4E7">Storage = persistent state</text>
</g>
</svg>